name: scrub

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # CI's single source of truth for the gitleaks version. The pre-commit hook
  # uses whatever gitleaks is installed locally, which is a separate, effective
  # identity; this pin governs CI only and makes no claim about the local binary.
  GITLEAKS_VERSION: "8.28.0"

jobs:
  gitleaks:
    name: gitleaks (source)
    runs-on: ubuntu-latest
    # Deliberately NOT gitleaks/gitleaks-action. Two reasons, both learned the
    # hard way:
    #
    #   1. The action derives its scan range from the push event as
    #      `first_commit^..last_commit`. After a history rewrite, the first
    #      commit in the push is the ROOT commit — and `root^` does not exist.
    #      git fatals, the action scans 0 bytes, reports "no leaks found", and
    #      then exits 1 because stderr was non-empty. A gate that fails on a
    #      force-push while reporting no leaks is worse than no gate.
    #
    #   2. The action pins its own gitleaks build (8.24.3 at time of writing)
    #      regardless of what runs locally. CI and pre-commit were scanning with
    #      different engines and different default rule sets.
    #
    # Scanning full history explicitly costs a few seconds and has neither
    # problem.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history: a leak in an old commit still leaks

      - name: Install gitleaks
        run: |
          # Download and extract as SEPARATE commands. The 2026-08-12 failure
          # surfaced from tar as "gzip: stdin: not in gzip format", obscuring
          # the download failure that preceded it. With this workflow's default
          # shell, a pipeline reports tar's status rather than curl's.
          # Separating the commands lets curl fail before tar is invoked.
          #
          # -S restores curl's error text (which -s suppresses). Staged through
          # RUNNER_TEMP so the checked-out workspace stays byte-identical and
          # neither the history scan nor the image glob can see the installer.
          curl --version | head -1
          curl -sSL --fail \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          sudo mv "${RUNNER_TEMP}/gitleaks" /usr/local/bin/
          gitleaks version

      # THE COUNT IS THE ASSERTION.
      #
      # gitleaks-action's failure mode was to scan 0 bytes, report "no leaks
      # found", and exit 1. A gate that reports clean over nothing is worse than
      # no gate, because it produces a green tick. So this step fails if the scan
      # touched nothing, rather than relying on someone reading the number.
      #
      # WHAT THE COUNT COUNTS: commits with a content diff, not commits.
      # gitleaks walks `git log -p`, so a commit that changes no bytes is neither
      # scanned nor counted. Verified 2026-07-17 against 49687f2 ("Restore exec
      # bit on audit-pii.sh", 100644 -> 100755, 0 insertions, 0 deletions):
      #
      #     gitleaks git . --log-opts="-1 49687f2"  ->  0 commits scanned, 0 bytes
      #     git rev-list --count HEAD               ->  13
      #     gitleaks git .                          ->  12 commits scanned
      #
      # That is correct: a commit with no content cannot leak. But it means the
      # count does NOT equal `git rev-list --count HEAD`, and never will once a
      # mode-only commit exists. Merge commits are excluded for the same reason —
      # `git log -p` does not diff them by default.
      #
      # Hence non-zero, not an exact match. An exact expected value has to be
      # recomputed on every push, is wrong the first time either case above
      # appears, and puts a parser of gitleaks' stdout on the critical path for
      # resolution nobody uses. Zero is what the failure actually looked like.
      - name: Scan full history
        run: |
          set -o pipefail
          gitleaks git . --config .gitleaks.toml --redact --no-banner \
            --report-format sarif --report-path results.sarif 2>&1 \
            | sed -E 's/\x1b\[[0-9;]*m//g' | tee scan.log

          commits=$(grep -oE '[0-9]+ commits scanned' scan.log | tail -1 | cut -d' ' -f1 || true)
          bytes=$(grep -oE 'scanned ~[0-9]+ bytes' scan.log | tail -1 | tr -dc '0-9' || true)

          if [ -z "$commits" ] || [ -z "$bytes" ]; then
            echo "::error::Could not parse the gitleaks scan summary. The gate cannot prove it looked, so it fails."
            exit 1
          fi
          if [ "$commits" -eq 0 ] || [ "$bytes" -eq 0 ]; then
            echo "::error::gitleaks scanned $commits commit(s) / $bytes byte(s). A clean result over nothing is not a clean result."
            exit 1
          fi
          echo "Scanned $commits commit(s), $bytes byte(s) of history."

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-results.sarif
          path: results.sarif
          if-no-files-found: ignore

  image-ocr:
    name: gitleaks (image OCR)
    runs-on: ubuntu-latest
    # The pre-commit hook can be bypassed with --no-verify, and a clone without
    # `pre-commit install` has no hooks at all. This is the backstop.
    steps:
      - uses: actions/checkout@v7

      - name: Install OCR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr

      - name: Install gitleaks
        run: |
          # Download and extract as SEPARATE commands. The 2026-08-12 failure
          # surfaced from tar as "gzip: stdin: not in gzip format", obscuring
          # the download failure that preceded it. With this workflow's default
          # shell, a pipeline reports tar's status rather than curl's.
          # Separating the commands lets curl fail before tar is invoked.
          #
          # -S restores curl's error text (which -s suppresses). Staged through
          # RUNNER_TEMP so the checked-out workspace stays byte-identical and
          # neither the history scan nor the image glob can see the installer.
          curl --version | head -1
          curl -sSL --fail \
            -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          sudo mv "${RUNNER_TEMP}/gitleaks" /usr/local/bin/
          gitleaks version

      - name: Install ExifTool (pinned + checksum-bound)
        run: |
          # Exact experimentally qualified version. The expected digest is fixed
          # here in reviewed bytes — NEVER derived from the artifact after
          # downloading it. Mismatch fails before installation. A version bump
          # is a deliberate reviewed diff changing pin + digest together; the
          # per-run oracle self-proof in ci-verify-image-metadata.sh catches
          # semantic regression on any new toolchain.
          EXIFTOOL_VERSION="12.76"
          EXIFTOOL_SHA256="07d1cdcf96153c94dca9489fff9bfc9475c399e0aecae5620591163198198b79"
          curl -sSL --fail \
            -o "${RUNNER_TEMP}/exiftool.tar.gz" \
            "https://github.com/exiftool/exiftool/archive/refs/tags/${EXIFTOOL_VERSION}.tar.gz"
          echo "${EXIFTOOL_SHA256}  ${RUNNER_TEMP}/exiftool.tar.gz" | sha256sum --check --strict
          tar xzf "${RUNNER_TEMP}/exiftool.tar.gz" -C "${RUNNER_TEMP}"
          sudo ln -sf "${RUNNER_TEMP}/exiftool-${EXIFTOOL_VERSION}/exiftool" /usr/local/bin/exiftool
          INSTALLED="$(exiftool -ver)"
          [ "${INSTALLED}" = "${EXIFTOOL_VERSION}" ] || { echo "ExifTool version mismatch: ${INSTALLED} != ${EXIFTOOL_VERSION}"; exit 1; }
          file --version | head -1

      - name: Image format census (tracked boundary + content detection)
        run: bash scripts/ci-image-census.sh

      - name: Image format parity gate
        run: python3 scripts/check-image-format-parity.py

      - name: Verify image metadata (byte-level strip idempotence)
        run: bash scripts/ci-verify-image-metadata.sh

      - name: Scan images (OCR)
        run: |
          # List production is hard-checked; a failed census must fail this
          # step too, not read as an empty image list (AUD-007 review P9).
          bash scripts/ci-image-census.sh --list0 > "${RUNNER_TEMP}/imgs0"
          readarray -d '' imgs < "${RUNNER_TEMP}/imgs0"
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "No images in repository - nothing to scan."
            exit 0
          fi
          echo "Scanning ${#imgs[@]} image(s)."
          bash scripts/scan-image-text.sh "${imgs[@]}"

  attack-matrix:
    name: Generated docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify coverage matrix matches detection specs
        run: python3 scripts/build-attack-matrix.py --check

      - name: Verify open-items report matches writeups
        run: python3 scripts/open-items.py --check

      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Verify posture register matches posture.yml
        run: python3 scripts/build-posture-register.py --check

      # Closes the gap that let POS-022 sit in the register for three days while
      # labs/01 printed the claim it disproves. Fails only for labs marked ✅ —
      # see the script's docstring for why it is not strict yet.
      - name: Verify every posture entry is cited in its own lab
        run: python3 scripts/check-lab-coverage.py --check

      - name: Verify evidence notes — schema and that every cited handle resolves
        run: python3 scripts/check-evidence-notes.py

      - name: Verify current-state authority relationship (selected revision, in-tree authority, exact digest)
        run: python3 scripts/check-current-state.py

      # Added 2026-08-11. The README lab table drifted to 19 labs and a
      # hardcoded 80 posture entries while the repository held 24 and 98 —
      # every gated document stayed correct and the one ungated surface did
      # not. This is the gate that closes that.
      - name: Verify README lab index mirrors the lab pages
        run: python3 scripts/build-lab-index.py --check
