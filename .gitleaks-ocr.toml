title = "defender-sentinel-soc-lab — OCR text rules (images only)"

# Applied ONLY to text extracted from images by scripts/scan-image-text.sh.
# Never applied to source files.
#
# Design rationale
# ----------------
# OCR does not recover high-entropy strings reliably. Tesseract's language model
# assists word-shaped tokens (emails, domains) and actively harms hex strings,
# which have no linguistic structure. Empirically, a GUID rendered in a
# screenshot survives OCR mangled ("72f988bf" -> "7 2(988bf") and defeats an
# exact-match rule at every page-segmentation mode.
#
# A third, learned from a real screenshot: patterns must not span newlines.
# `\s` matches "\n", so a page where tesseract renders the external-link glyph
# as "@" produced "Learn more @" + newline + "Your organization is not
# protected..." and matched the email rule. Every rule here uses [ \t] instead
# of \s. OCR text is line-structured; a cross-line match is always spurious.
#
# Two consequences shape this file:
#
#   1. Patterns are FUZZY. They tolerate inserted spaces, dropped separators,
#      and common character confusions (0/O, 1/l/I, 5/S, 8/B).
#   2. Where the value cannot be matched, the LABEL is matched instead. Portal
#      chrome renders "Tenant ID" and "Subscription ID" in clean UI fonts that
#      OCR reads accurately, even when the adjacent value degrades. The label's
#      presence is sufficient grounds to force review.
#
# False positives are cheap here. A flagged image costs one manual look, which
# SANITIZATION.md section 4 already requires. A missed one is permanent.

[extend]
useDefault = false

# ──────────────────────────────────────────────────────────────
# Label detection — the reliable signal
# ──────────────────────────────────────────────────────────────

[[rules]]
id = "ocr-identifier-label"
description = "Portal chrome label indicating an adjacent identifier — review the value"
regex = '''(?i)(tenant[ \t]*id|subscription[ \t]*id|directory[ \t]*id|object[ \t]*id|workspace[ \t]*id|application[ \t]*\(?client\)?[ \t]*id|immutable[ \t]*id|resource[ \t]*id)'''
tags = ["ocr", "label", "review"]

[[rules]]
id = "ocr-directory-chrome"
description = "Directory switcher / account chrome captured in screenshot"
regex = '''(?i)(directory[ \t]*[:.]|signed[ \t]*in[ \t]*as|switch[ \t]*directory|current[ \t]*directory)'''
tags = ["ocr", "label", "review"]

# ──────────────────────────────────────────────────────────────
# Fuzzy value detection
# ──────────────────────────────────────────────────────────────

[[rules]]
id = "ocr-fuzzy-guid"
description = "GUID-shaped token surviving OCR distortion"
regex = '''(?:[0-9a-zA-Z()\[\]{}|!][ \t]*){6,11}[-–—][ \t]*(?:[0-9a-zA-Z()\[\]{}|!][ \t]*){2,7}[-–—][ \t]*(?:[0-9a-zA-Z()\[\]{}|!][ \t]*){2,7}[-–—][ \t]*(?:[0-9a-zA-Z()\[\]{}|!][ \t]*){2,7}[-–—][ \t]*(?:[0-9a-zA-Z()\[\]{}|!][ \t]*){9,16}'''
tags = ["ocr", "identifier"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''^[0O]{8}[ \t]*-[ \t]*[0O]{4}[ \t]*-[ \t]*[0O]{4}[ \t]*-[ \t]*[0O]{4}[ \t]*-[ \t]*[0O]{12}$''',
  ]

[[rules]]
id = "ocr-fuzzy-onmicrosoft"
description = "onmicrosoft.com tenant domain, separators possibly lost to OCR"
regex = '''(?i)[a-z0-9\-]{2,}[ \t]*\.?[ \t]*onmicrosoft[ \t]*\.?[ \t]*com'''
tags = ["ocr", "identifier"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''(?i)^contoso[ \t]*\.?[ \t]*onmicrosoft[ \t]*\.?[ \t]*com$''']

[[rules]]
id = "ocr-fuzzy-cloudapp"
description = "Azure VM public DNS name, separators possibly lost to OCR"
regex = '''(?i)cloudapp[ \t]*\.?[ \t]*azure[ \t]*\.?[ \t]*com'''
tags = ["ocr", "operational"]

[[rules]]
id = "ocr-email"
description = "Email / UPN visible in screenshot"
# Does NOT require the dot before the TLD. Tesseract routinely eats periods in
# small UI text: a real portal screenshot rendered "analyst@contoso.com" as
# "analyst@contosocom", which defeated a dot-requiring pattern entirely.
# In a portal screenshot an "@" flanked by word characters is an email; the
# only other source is OCR misreading the external-link glyph, and that case
# has nothing after the "@", so requiring 3+ trailing characters excludes it.
regex = '''[a-zA-Z0-9._%+\-]{2,}[ \t]*@[ \t]*[a-zA-Z0-9][a-zA-Z0-9._\-]{2,}'''
tags = ["ocr", "pii"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # Dot optional here too: a sanitized screenshot whose placeholder OCRs
    # as "analyst@contosocom" must still clear the allowlist, or the gate
    # blocks correctly-redacted evidence and gets switched off.
    '''(?i)@[ \t]*contoso[ \t]*\.?[ \t]*(com|onmicrosoft)''',
    '''(?i)@[ \t]*example[ \t]*\.?[ \t]*(com|org|net)''',
    '''(?i)@[ \t]*microsoft[ \t]*\.?[ \t]*com''',
    '''(?i)@[ \t]*users[ \t]*\.?[ \t]*noreply''',
  ]

# ── Mangled-IP heuristics (WARN tier) ────────────────────────
#
# OCR cannot reliably recover IPv4 from small UI text. A real screenshot
# rendered "203.0.113.135" as "2030113.135" and "20301133.35" — the periods were
# eaten, leaving a digit run no dotted-quad pattern can match. Unlike emails
# (where "@" survives) and domains (where "onmicrosoft" survives), an IP has no
# invariant anchor: strip its dots and it is indistinguishable from a version
# string, a timestamp, or an order number.
#
# So these two rules WARN rather than BLOCK. Blocking on every digit run would
# fire on nearly every screenshot; warning prompts the look that
# SANITIZATION.md section 4 already requires. This is the limitation, stated
# honestly rather than patched over: the OCR gate does not reliably catch IPs
# in images. Only a human does.

[[rules]]
id = "ocr-ip-context"
description = "Wording that typically sits beside an IP address — check for an adjacent address"
regex = '''(?i)(requested[ \t]+from|ip[ \t]*address|source[ \t]*ip|remote[ \t]*ip|client[ \t]*ip|public[ \t]*ip|signed[ \t]*in[ \t]*from)'''
tags = ["ocr", "label", "review"]

[[rules]]
id = "ocr-fuzzy-ipv4"
description = "Digit run that may be an IPv4 with OCR-eaten separators"
# Targets the SHAPE of a dot-eaten IP: a long digit run, then a surviving dot,
# then a short run — "203.0.113.135" collapsing to "2030113.135" or "20301133.35".
# An earlier version allowed all dots to be optional, which matched any 4-digit
# number: every date and timestamp warned. A gate that always warns is one
# nobody reads, so the pattern requires at least one surviving separator.
regex = '''\b\d{4,12}[ \t]*\.[ \t]*\d{1,3}\b'''
tags = ["ocr", "label", "review"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''^192[ \t]*\.[ \t]*0[ \t]*\.[ \t]*2[ \t]*\.''',
    '''^198[ \t]*\.[ \t]*51[ \t]*\.[ \t]*100[ \t]*\.''',
    '''^203[ \t]*\.[ \t]*0[ \t]*\.[ \t]*113[ \t]*\.''',
    '''^10[ \t]*\.''',
    '''^192[ \t]*\.[ \t]*168[ \t]*\.''',
    '''^127[ \t]*\.''',
  ]

[[rules]]
id = "ocr-ipv4"
description = "IPv4 visible in screenshot — classify as attacker-side or lab-side"
regex = '''\b\d{1,3}[ \t]*\.[ \t]*\d{1,3}[ \t]*\.[ \t]*\d{1,3}[ \t]*\.[ \t]*\d{1,3}\b'''
tags = ["ocr", "operational"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''^192[ \t]*\.[ \t]*0[ \t]*\.[ \t]*2[ \t]*\.''',
    '''^198[ \t]*\.[ \t]*51[ \t]*\.[ \t]*100[ \t]*\.''',
    '''^203[ \t]*\.[ \t]*0[ \t]*\.[ \t]*113[ \t]*\.''',
    '''^10[ \t]*\.''',
    '''^192[ \t]*\.[ \t]*168[ \t]*\.''',
    '''^127[ \t]*\.''',
    '''^172[ \t]*\.[ \t]*(1[6-9]|2[0-9]|3[01])[ \t]*\.''',
  ]
