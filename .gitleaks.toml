title = "defender-sentinel-soc-lab — Azure / Sentinel scrub rules"

# Inherit gitleaks' default rule set (AWS keys, GitHub PATs, private keys, JWTs,
# generic high-entropy strings) and layer Azure-specific rules on top.
#
# NOTE: gitleaks compiles patterns with RE2 — no lookahead/lookbehind.
# Exceptions are expressed via allowlists, never via negative lookahead.
[extend]
useDefault = true

# ──────────────────────────────────────────────────────────────
# Global allowlist — approved placeholders from SANITIZATION.md
# ──────────────────────────────────────────────────────────────
# These are exact-value exceptions, not category exemptions. Each entry is a
# public constant identical for every tenant/subscription, carrying zero
# information about this environment. A real tenant/subscription/object ID or a
# real public IP is still caught — only these specific published values pass.
[allowlist]
description = "Approved synthetic placeholders, reserved ranges, and public Microsoft/Azure constants"
regexTarget = "match"
regexes = [
  '''00000000-0000-0000-0000-000000000000''',
  '''contoso\.(com|onmicrosoft\.com)''',
  # Public Microsoft ASR rule GUIDs — documented, identical for every tenant,
  # not environment identifiers. (Lab 06 / POS-031.)
  '''d1e49aac-8f56-4280-b9ba-993a6d77406c''',   # Block process creations from PSExec/WMI
  '''e6db77e5-3df2-4cf1-b95a-636979351e5b''',   # Block WMI event-subscription persistence
  # Azure WireServer — fixed virtual platform IP, identical in every Azure VNet,
  # not a routable lab or attacker address. (Lab 06 / device-discovery note.)
  '''168\.63\.129\.16''',
]
# No global path exemptions.
#
# SANITIZATION.md, .gitleaks.toml and .gitignore were previously exempted so
# their placeholder examples would not trip rules. That was both unnecessary —
# the regex allowlists above already clear every placeholder — and actively
# harmful: it exempted those files from EVERY rule, meaning the document that
# defines the redaction policy was the one document the scanner never read. A
# real workspace key pasted into an example there would have passed all three
# gates. Verified: with no path exemptions, the repository scans clean.

# ──────────────────────────────────────────────────────────────
# Identifiers — not secrets, but real tenant coordinates
# ──────────────────────────────────────────────────────────────

[[rules]]
id = "azure-guid-any"
description = "GUID that is not an approved placeholder — possible tenant/subscription/workspace/object ID"
regex = '''\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b'''
tags = ["azure", "identifier", "pii"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''00000000-0000-0000-0000-000000000000''',
  ]

[[rules]]
id = "azure-resource-id"
description = "Fully-qualified Azure resource ID (embeds subscription GUID and resource group)"
regex = '''/subscriptions/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/resourceGroups/[\w\-.()]+'''
tags = ["azure", "identifier"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''/subscriptions/00000000-0000-0000-0000-000000000000/''']

[[rules]]
id = "azure-tenant-domain"
description = "Real .onmicrosoft.com tenant domain"
regex = '''\b[a-zA-Z0-9][a-zA-Z0-9\-]{2,}\.onmicrosoft\.com\b'''
tags = ["azure", "identifier", "pii"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = ['''(?i)^contoso\.onmicrosoft\.com$''']

[[rules]]
id = "upn-email"
description = "Email address / UPN that is not an approved placeholder"
regex = '''\b[a-zA-Z0-9._%+\-]+@[a-zA-Z0-9][a-zA-Z0-9.\-]*\.[a-zA-Z]{2,}\b'''
tags = ["pii"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''(?i)@contoso\.(com|onmicrosoft\.com)$''',
    '''(?i)@example\.(com|org|net)$''',
    '''(?i)@(microsoft|github)\.com$''',
    '''(?i)@users\.noreply\.github\.com$''',
  ]

# ──────────────────────────────────────────────────────────────
# Hard secrets
# ──────────────────────────────────────────────────────────────

[[rules]]
id = "log-analytics-workspace-key"
description = "Log Analytics workspace shared key (88-char base64)"
regex = '''(?i)(workspace[_\-]?key|shared[_\-]?key|primary[_\-]?key|secondary[_\-]?key)["']?\s*[:=]\s*["']?([A-Za-z0-9+/]{86}==)'''
secretGroup = 2
tags = ["azure", "secret", "critical"]

[[rules]]
id = "azure-ad-client-secret"
description = "Entra ID application client secret (assignment form)"
regex = '''(?i)(client[_\-]?secret|app[_\-]?secret|application[_\-]?password)["']?\s*[:=]\s*["']?([A-Za-z0-9~._\-]{34,60})'''
secretGroup = 2
tags = ["azure", "secret", "critical"]

[[rules]]
id = "azure-ad-secret-prefixed"
description = "Entra ID client secret (current prefixed format)"
regex = '''\b[A-Za-z0-9_~.\-]{3}8Q~[A-Za-z0-9_~.\-]{31,34}\b'''
tags = ["azure", "secret", "critical"]

[[rules]]
id = "logic-app-callback-url"
description = "Logic App / playbook trigger callback URL — contains SAS signature"
regex = '''https://[a-z0-9\-]+(\.[a-z0-9\-]+)*\.logic\.azure\.com[^\s"']*[?&]sig=[A-Za-z0-9%_\-]+'''
tags = ["azure", "secret", "critical", "sentinel"]

[[rules]]
id = "azure-sas-token"
description = "Azure Shared Access Signature token"
regex = '''[?&]sig=[A-Za-z0-9%+/=_\-]{20,}'''
tags = ["azure", "secret"]

[[rules]]
id = "azure-storage-connection-string"
description = "Azure Storage account connection string"
regex = '''DefaultEndpointsProtocol=https;AccountName=[^;]+;AccountKey=[A-Za-z0-9+/=]{40,}'''
tags = ["azure", "secret", "critical"]

[[rules]]
id = "automation-webhook"
description = "Azure Automation webhook URI"
regex = '''https://[a-z0-9\-]+\.webhook\.[a-z0-9\-]+\.azure-automation\.net/webhooks\?token=[A-Za-z0-9%+/=]+'''
tags = ["azure", "secret", "critical"]

# ──────────────────────────────────────────────────────────────
# Operational — live lab attack surface
# ──────────────────────────────────────────────────────────────

[[rules]]
id = "public-ipv4-review"
description = "Routable IPv4 — confirm it is attacker-side/TI, not a lab endpoint"
regex = '''\b((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\b'''
tags = ["operational", "review"]
  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # RFC 5737 documentation ranges
    '''^192\.0\.2\.''',
    '''^198\.51\.100\.''',
    '''^203\.0\.113\.''',
    # RFC 1918 private
    '''^10\.''',
    '''^192\.168\.''',
    '''^172\.(1[6-9]|2[0-9]|3[01])\.''',
    # Loopback / link-local / unspecified / broadcast
    '''^127\.''',
    '''^169\.254\.''',
    '''^0\.0\.0\.0$''',
    '''^255\.255\.255\.''',
    # Four-octet agent build numbers, shape-identical to IPv4 and public
    # constants. Mirrored in scripts/audit-pii.sh - the two scanners keep
    # independent exception lists and neither reads the other.
    '''^1\.43\.0\.0$''',
    # Three-octet version strings never match this rule; four-octet ones do.
    # Other common version strings are handled by the path allowlist below.
  ]
  paths = ['''(?i)(package-lock\.json|yarn\.lock|requirements\.txt|CHANGELOG\.md)''']

[[rules]]
id = "azure-vm-public-dns"
description = "Azure-assigned public DNS name for a lab VM"
regex = '''\b[a-z0-9\-]+\.[a-z0-9\-]+\.cloudapp\.azure\.com\b'''
tags = ["operational", "critical"]

[[rules]]
id = "mac-address"
description = "MAC address (EUI-48, colon or hyphen form) — a hardware identifier tied to a specific machine"
# The two separator forms are enumerated. A per-octet [:-] class accepted mixed
# strings such as 00:00-5e:00-53:01, which are not valid addresses.
# Boundaries are consumed because RE2 has no lookarounds; the address itself is
# secretGroup 1. Hex-class boundaries fired on x00:00:5e:00:53:01z and on
# 00:00:5e:00:53:01.example, so the classes below are identifier-class, matching
# public-ipv6-review. No label alternative: it would admit MAC:02:... but would
# also extract a six-group substring from a seven-group colon run such as
# ab:00:00:5e:00:53:01.
# Dotted EUI-48 / Cisco-style three-group notation (0011.2233.4455) is
# deliberately outside this detector's colon/hyphen representation scope.
regex = '''(?:^|[^0-9A-Za-z:._\-])((?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|(?:[0-9A-Fa-f]{2}-){5}[0-9A-Fa-f]{2})(?:[^0-9A-Za-z:._\-]|\.[^0-9A-Za-z_\-]|\.$|$)'''
secretGroup = 1
tags = ["operational", "identifier"]
  [rules.allowlist]
  # No regexTarget: the default target is the extracted Secret. "match" would
  # test these against the whole match including the consumed boundaries, where
  # they can never fire, and the broadcast address would be reported.
  # Forms are enumerated as in the rule: a mixed-separator string is not a valid
  # address, so it is not listed here as a benign one.
  regexes = [
    '''(?i)^(?:00:){5}00$''',
    '''(?i)^(?:00-){5}00$''',
    '''(?i)^(?:ff:){5}ff$''',
    '''(?i)^(?:ff-){5}ff$''',
    # RFC 7042 documentation block, both representations
    '''(?i)^00:00:5e:00:53:''',
    '''(?i)^00-00-5e-00-53-''',
  ]

[[rules]]
id = "public-ipv6-review"
description = "Routable IPv6 — confirm it is attacker-side/TI, not a lab endpoint"
# RFC 4291 textual forms. The mixed dotted-decimal branches are listed first so
# leftmost-first alternation prefers a whole match over a truncated hex one.
# Compressed mixed forms are enumerated per leading-hextet count b with trailing
# count 5-b: the dotted quad is already two 16-bit groups and "::" must compress
# at least one, so explicit hextets either side total at most five. Independent
# counts accepted 1:2:3:4:5::6:7:8:9:192.0.2.1.
# Boundaries are consumed (RE2 has no lookarounds); address is secretGroup 1.
# The trailing class treats ".", "_" and "-" as identifier characters, matching
# the leading class: an asymmetric version fired on 2001:db8::8888.example and
# let 2001:4860::8888_suffix terminate early, and a digit-only test let
# 1:2:3:4:5:6::192.0.2.1 truncate to ...::192.
# A routable mixed-form address is reported here and its dotted tail by
# public-ipv4-review. Two findings for one value is intended; the alternative is
# the two rules disagreeing about who owns the dotted component.
regex = '''(?i)(?:^|[^0-9A-Za-z:._\-]|[A-Za-z][A-Za-z0-9_]*:)((?:[0-9a-f]{1,4}:){6}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|::(?:[0-9a-f]{1,4}:){0,5}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){1}:(?:[0-9a-f]{1,4}:){0,4}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){2}:(?:[0-9a-f]{1,4}:){0,3}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){3}:(?:[0-9a-f]{1,4}:){0,2}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){4}:(?:[0-9a-f]{1,4}:){0,1}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){5}:(?:[0-9a-f]{1,4}:){0,0}(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:\.(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}|(?:[0-9a-f]{1,4}:){7}[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,7}:|(?:[0-9a-f]{1,4}:){1,6}:[0-9a-f]{1,4}|(?:[0-9a-f]{1,4}:){1,5}(?::[0-9a-f]{1,4}){1,2}|(?:[0-9a-f]{1,4}:){1,4}(?::[0-9a-f]{1,4}){1,3}|(?:[0-9a-f]{1,4}:){1,3}(?::[0-9a-f]{1,4}){1,4}|(?:[0-9a-f]{1,4}:){1,2}(?::[0-9a-f]{1,4}){1,5}|[0-9a-f]{1,4}:(?::[0-9a-f]{1,4}){1,6}|:(?:(?::[0-9a-f]{1,4}){1,7}|:))(?:[^0-9A-Za-z:._\-]|\.[^0-9A-Za-z_\-]|\.$|$)'''
secretGroup = 1
tags = ["operational", "review"]
  [rules.allowlist]
  regexes = [
    # RFC 3849 documentation range. Relocated here from the global allowlist,
    # where it was an exception to a rule that did not yet exist.
    '''(?i)^2001:0?db8:''',
    '''(?i)^fe[89ab][0-9a-f]:''',      # RFC 4291 link-local FE80::/10
    '''(?i)^f[cd][0-9a-f]{2}:''',      # RFC 4193 unique local FC00::/7
    '''(?i)^ff[0-9a-f]{2}:''',         # RFC 4291 multicast FF00::/8
    '''(?i)^(?:0{1,4}:){7}0*[01]$''',  # full-notation unspecified and loopback
    '''^::[01]?$''',                   # compressed unspecified and loopback
  ]
