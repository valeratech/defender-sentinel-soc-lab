# One-time setup:
#   pre-commit install
#   pre-commit run --all-files
#
# Dependencies — all hooks fail closed, so install these first:
#   gitleaks version      (brew install gitleaks | github.com/gitleaks/gitleaks/releases)
#   exiftool -ver         (brew install exiftool | apt-get install libimage-exiftool-perl)
#   tesseract --version   (brew install tesseract | apt-get install tesseract-ocr)
#   pre-commit --version  (pip install pre-commit)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: detect-private-key
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending

  - repo: local
    hooks:
      # Uses the locally installed gitleaks binary rather than the upstream
      # pre-commit hook, which is language:golang and builds gitleaks from
      # source on first run — a slow, network-dependent step that fails behind
      # a proxy. The binary is already a dependency of the OCR hook below, so
      # this also guarantees both hooks scan with the same version.
      - id: gitleaks
        name: gitleaks (Azure/Sentinel scrub rules)
        entry: gitleaks git --staged --redact --config .gitleaks.toml --no-banner
        language: system
        pass_filenames: false

      - id: block-binaries
        name: block executable/binary artifacts
        entry: "Binary artifact staged - see SANITIZATION.md section 6"
        language: fail
        files: '\.(exe|dll|bin|msi|scr|jar|iso|vhd|vhdx)$'

      - id: block-raw-captures
        name: block raw packet/event captures
        entry: "Raw capture staged - commit sanitized excerpts only (SANITIZATION.md section 3)"
        language: fail
        files: '\.(pcap|pcapng|etl|evtx|har|nettrace)$'

      # Policy before mechanics: reject unsupported or mis-cased image formats
      # before anything strips or scans them. The regex only ROUTES candidates
      # (any case, supported+rejected); the verdict lives in sourced logic
      # against scripts/image-formats.sh (SANITIZATION.md section 10).
      - id: image-policy
        name: image format policy (supported set, lowercase-exact)
        entry: bash scripts/check-image-policy.sh
        language: system
        files: '(?i)\.(png|jpg|jpeg|webp|gif|bmp|tif|tiff|avif|heic|heif|ico|jfif|svg)$'
        pass_filenames: true

      # Order matters: strip metadata BEFORE OCR scanning, so the scan runs
      # against the image that will actually be committed.
      - id: strip-image-metadata
        name: strip EXIF/metadata from images
        entry: bash scripts/hook-strip-images.sh
        language: system
        files: '\.(png|jpg|jpeg|webp)$'

      - id: ocr-scan-images
        name: OCR images and scan extracted text
        description: >-
          gitleaks reads bytes, not pixels. This OCRs each staged image and
          scans the recovered text. A net, not a guarantee - manual visual
          review is still mandatory per SANITIZATION.md section 4.
        entry: bash scripts/hook-ocr-images.sh
        language: system
        files: '\.(png|jpg|jpeg|webp)$'
        pass_filenames: true

      - id: generated-docs-fresh
        name: generated docs match their sources
        entry: bash -c 'python3 scripts/build-attack-matrix.py --check && python3 scripts/open-items.py --check && python3 scripts/build-posture-register.py --check && python3 scripts/check-lab-coverage.py --check && python3 scripts/check-evidence-notes.py && python3 scripts/build-lab-index.py --check'
        language: system
        pass_filenames: false
        files: '^(labs/|detections/|docs/|posture\.yml|scripts/|README\.md)'

      # AUD-007 anti-drift gate: every surface that names image extensions is
      # contract-checked against scripts/image-formats.sh. Dedicated hook with
      # its own trigger because the generated-docs-fresh trigger does not cover
      # these policy surfaces; CI also runs it unconditionally.
      - id: image-format-parity
        name: image format surfaces match the machine authority
        entry: python3 scripts/check-image-format-parity.py
        language: system
        pass_filenames: false
        files: '^(\.pre-commit-config\.yaml|\.gitattributes|SANITIZATION\.md|\.github/workflows/scrub\.yml|scripts/(image-formats\.sh|check-image-format-parity\.py|check-image-policy\.sh|hook-strip-images\.sh|hook-ocr-images\.sh|detect-animation\.py|ci-image-census\.sh|ci-verify-image-metadata\.sh|audit-pii\.sh))$'
