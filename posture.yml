    location: Defender > Threat policies > Anti-phishing > Office365 AntiPhish Default
    state: Always on; impersonation protection off; all impersonation actions set to take no action
    baseline: Microsoft Standard preset enables user and domain impersonation protection with quarantine actions
    kind: default
