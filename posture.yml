    location: Cost Management + Billing > Billing scopes / Payment methods
    state: Two Microsoft Customer Agreement billing accounts, identically named, each with its own billing profile. Profile A holds the $200 credit (expires 2026-08-13) and has never carried a charge. Profile B carries every dollar of lab spend and holds no credit.
    baseline: n/a - structure produced by the two-trial acquisition path, not chosen
    kind: gap
