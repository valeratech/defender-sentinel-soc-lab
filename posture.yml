      Under a Microsoft Customer Agreement, credits attach to a billing
      profile and pay down only that profile's invoice. The $200 credit is
      therefore structurally unable to reach the lab's spend — not expired,
      not consumed, not conditional: attached to an invoice the lab does not
      bill to. This is the mechanism behind the POS-005 correction, and it is
      why the credit was invisible for 18 days — the surface consulted
      (resource cost analysis) is scoped to the subscription, which belongs to
      profile B, and profile A's credit appears on no surface reachable from
      there.

      DECISION, recorded with reasoning: do not chase the credit. Migrating
      existing resources or rebuilding state to capture $200 costs hours of an
      11-day budget, and the VMs carry ASR state that POS-031's pending
      enforcement-scope test is a test OF. The credit expires unspent on
      2026-08-13 by choice.

      RELATED HAZARD: the two subscriptions are BOTH named "Azure subscription
      1". Every subscription picker in every portal shows the name, and the
      name does not disambiguate — a deployment aimed at the wrong one would
      look correct at every step. Renaming one is a standing recommendation,
      unexecuted because every existing artifact references the current
      names' GUIDs rather than display names.

