      anything. (d) non-evaluation upstream is indistinguishable from (c).

      And (c) is itself uncertain: the grid reads 0 while the flyout on the
      same screen reports coverage of all active users at High (divergence row
      83). Two surfaces, one field, no third surface to break the tie. The
      leading candidate rests on believing the persistent reading on the field
      named for the question - recorded as a choice, not as a measurement.
      Mechanism open.

