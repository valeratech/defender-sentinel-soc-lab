  - id: POS-064
    lab: "15"
    setting: Lab IRM policy - Data leaks template, DLP-match trigger against a simulation-mode policy
    location: Purview > Insider Risk Management > Policies > Lab15-DataLeaks-DLPTrigger
    state: Created 2026-08-03 08:52 PDT. Template Data leaks. All users, no exclusions. Priority content = the three Lab 14 SITs (ABA Routing, Credit Card, US Bank Account). Scoring = all activity (default). Trigger = "User matches a DLP policy" scoped to Lab14-USFinancial-Simulation only. 39/103 indicators auto-selected from the org set and kept. Microsoft-provided thresholds. Notifications - first-alert ON, high-severity OFF, weekly OFF
    baseline: n/a - operator-created
    kind: default
    production: A production IRM policy needs a triggering event that can actually fire - which per the wizard's own fine print means a DLP policy in enforcement mode emitting High-severity incident reports. It also needs Analytics on (or thresholds set deliberately), Insider risk settings configured rather than skipped, and a scored user population. This policy has none of those and is retained as a measurement, not as a control
    revisit: false
    verified: 2026-08-05
    note: >-
      Built to answer one question: does a SIMULATION-MODE DLP match function
      as an IRM triggering event? Answer, measured over 49 hours across three
      independent surfaces: NO - and nothing anywhere says so.

      The trigger dropdown listed all five tenant DLP policies with ZERO mode
      or severity annotation, while the same wizard screen states the DLP
      policy "must be configured to generate 'High' severity incident
      reports". The selector does not enforce the requirement the wizard
      states one paragraph away.

      OUTCOME (2026-08-05): NULL, confirmed twice on each surface. Trigger
      email sent 09:11 PDT 2026-08-03 and MATCHED - Lab 14's report carries it
      as LAB15 TRIGGER TEST.eml, Exchange, Aug 3 4:11 PM UTC, Low volume rule,
