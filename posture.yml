      demonstrably occurred. At +25 h and again at +49 h: Alerts (preview) 0
      items, no first-alert notification email in either inbox tab, Active
      alerts 0, Last alert "No alerts yet".

      ONE null, FOUR candidate causes - not four independent rejections. They
      are not co-equal: (c) Users in scope = 0, persistent across 49 h, would
      PREEMPT the others, since a policy with no scored population may never
      have evaluated the trigger at all, leaving (a) simulation-mode and (b)
