    note: >-
      The policy reads Always on and Enabled: True. Underneath, three independent
      layers do nothing.

      EnableTargetedUserProtection: False, 0 senders specified. Domain
      impersonation off for owned domains and 0 custom domains. Mailbox
      intelligence is ON and learning each mailbox's contact patterns -
      EnableMailboxIntelligence: True - but mailbox intelligence FOR
      impersonations is off, so nothing reads its output. And all three
      impersonation actions read "Don't apply any action", so even a detection
      would produce nothing. PhishThresholdLevel is 1, the least aggressive of
      four. All four safety tips off.

      The EOP half of the same policy IS live: DMARC p=quarantine quarantines,
      p=reject rejects, spoof intelligence moves to junk. The accurate statement
      is not "anti-phishing is off" - it is that EOP spoof protection works out of
      the box and MDO impersonation protection ships inert.

      Configuration analyzer independently flags 12 anti-phishing items against
