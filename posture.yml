# Security posture register — source of truth for docs/posture-register.md
#
# Every security-relevant setting observed in the environment, its state, and
# whether it needs revisiting before the project is called done.
#
# kind:
#   hardened  — set to the secure/recommended value
#   default   — inherited, not chosen; recorded so it is not mistaken for a decision
#   weakening — deliberately loosened for lab convenience; production answer differs
#   gap       — should be on per vendor guidance / exam scope, currently is not
#
# verified: ISO date the state was observed directly (screenshot/portal), or null
#           if only asserted. Unverified entries are claims, not findings.
#
# revisit:  true if this must be reconsidered before the project is complete.

entries:
  # ---------- Lab 00 — tenant, licensing, identity ----------
  - id: POS-001
    lab: "00"
    setting: Security Defaults
    location: Entra ID > Overview > Properties
    state: Disabled
    baseline: Enabled (tenant default since 2019-10-22)
    kind: weakening
    production: Conditional Access policies replacing the baseline
    revisit: true
    verified: 2026-07-16
    note: >-
      Active change, not inherited. Nothing replaced it — no Conditional Access
      exists, so the tenant runs with no baseline identity protection. Required
      to be off before Conditional Access can be used at all.

  - id: POS-002
    lab: "00"
    setting: Admin identity model
    location: Tenant-wide
    state: Single standing Global Administrator across all portals
    baseline: n/a
    kind: weakening
    production: Role-scoped admin accounts; PIM eligible assignment
    revisit: true
    verified: null
    note: >-
      Asserted by the operator, not observed in a portal view. One credential
      holds total authority; audit trail cannot distinguish this identity's
      actions from any other's because there is no other.

  - id: POS-003
    lab: "00"
    setting: Conditional Access policies
    location: Entra ID > Protection > Conditional Access
    state: None believed configured
    baseline: n/a
    kind: gap
    production: Risk-based and device-compliance grant controls
    revisit: true
    verified: null
    note: >-
      Inferred, not observed. The Manage security defaults control being
      available is suggestive (the option is hidden where CA is in use) but is
      not proof. Needs a direct look at the CA blade.

  - id: POS-004
    lab: "00"
    setting: Elevate access to all Azure subscriptions
    location: Entra ID > Overview > Properties
    state: "Off"
    baseline: "Off"
    kind: default
    production: "Off, elevated only transiently when required"
    revisit: false
    verified: 2026-07-16
    note: >-
      Governs whether the Global Administrator can assume User Access
      Administrator across every subscription and management group. At default.

  - id: POS-005
    lab: "00"
    setting: Azure subscription funding model
    location: Azure > Subscriptions
    state: Pay-as-you-go, uncapped consumption
    baseline: n/a
    kind: gap
    production: Budgets with alert thresholds; auto-shutdown on lab compute
    revisit: true
    verified: 2026-07-16
    note: >-
      Free-credit offer unavailable, so the "services disabled, never charged"
      safety net does not exist. The spending limit feature is unavailable on
      pay-as-you-go, so there is no mechanism that stops spend — only ones that
      report it. Deallocating lab compute is therefore the actual cost control;
      the budget is what reports that the habit slipped.

  - id: POS-015
    lab: "00"
    setting: Cost budgets - two, at different scopes
    location: Cost Management + Billing > Budgets
    state: Resource group $15/mo (actual 50/80/100); subscription $25/mo (actual 50/80/100 + forecasted 100)
    baseline: none
    kind: hardened
    production: Same, plus an action group driving automated shutdown
    revisit: true
    verified: 2026-07-16
    note: >-
      Two budgets exist deliberately rather than one. The resource-group budget
      ($15) is the tighter tripwire on the lab's own resources; the
      subscription budget ($25) is the backstop that catches spend the first
      one structurally cannot see. Consolidating to one was rejected in both
      directions: a resource-group budget cannot see spend outside its group —
      which matters once Lab 04 creates the Log Analytics workspace, since
      ingestion is the largest projected cost and may not land there — and a
      subscription budget cannot attribute spend to a component. Cost of
      keeping both is duplicate mail when spend falls inside the group.

      Budget scope is fixed at creation, so the subscription budget had to be
      created new rather than rescoped.

      LIMITS, recorded rather than assumed away:
      (1) Azure budgets notify, they do not cap. There is no spending limit on
      pay-as-you-go, so spend continues past 100 percent. POS-016 —
      deallocating the VM — remains the only actual control; the budget only
      reports that the habit slipped.
      (2) Azure evaluates budgets roughly every 8-24 hours, not on demand, so
      an alert can arrive a day after a runaway resource starts billing.
      (3) These budgets cover Azure consumption ONLY. The Microsoft 365 E5
      conversion (POS-017) bills through a separate system and is invisible to
      Azure Cost Management at any scope. The most certain charge on this
      tenant has no alert attached to it — only a calendar date.
      (4) Forecasted alerting was added to the subscription budget but the
      resource-group budget remains actual-only, so its warnings still arrive
      after the spend.
      (5) Neither alert has ever fired. Recipients are configured but the
      notification path is unvalidated, which by this repo's own standard makes
      it a hypothesis rather than a control.

  - id: POS-016
    lab: "00"
    setting: Lab VM power state discipline
    location: Azure > Virtual machines
    state: Stopped (deallocated) - verified in portal
    baseline: n/a
    kind: hardened
    production: Stopped (deallocated) + auto-shutdown schedule
    revisit: true
    verified: 2026-07-16
    note: >-
      Portal status column reads "Stopped (deallocated)", not "Stopped".
      Compute is released and not billing. The distinction is load-bearing
      rather than pedantic: shutting down from inside the guest OS leaves the
      VM allocated and billing, and the portal reports that state as plain
      "Stopped".

      This is the primary cost control on this subscription. POS-005 records
      that pay-as-you-go has no spending limit, and POS-015 records that Azure
      budgets notify but do not cap and are evaluated only every 8-24 hours.
      Deallocation is therefore the only mechanism here that actually ends
      spend rather than reporting it.

      REVISIT: verified as a one-time observation, not as a control. The
      current mechanism is operator memory, which is not a control at all —
      Lab 03 onward introduces sessions that end at whatever time they end. An
      auto-shutdown schedule (VM > Operations > Auto-shutdown) would make it
      one, and would cost nothing. Left open deliberately rather than closed on
      the strength of a habit.

  # ---------- Lab 01 — device registration and enrollment ----------
  - id: POS-017
    lab: "00"
    setting: M365 trial recurring billing
    location: M365 admin center > Billing > Your products
    state: O365 E5 recurring OFF (expires 2026-08-14); M365 E5 recurring ON, converts 2026-08-13
    baseline: "On"
    kind: hardened
    production: n/a
    revisit: true
    verified: 2026-07-16
    note: >-
      Two subscriptions exist. Office 365 E5 was the acquisition path — the
      operator reports it had to be signed up for before Microsoft 365 E5 could
      be added — and each carries its own recurring billing setting, so turning
      one off does nothing for the other. Both are configured 1 license, 1
      month, pay monthly: O365 E5 at $49.20/mo, M365 E5 rate not yet displayed
      while in trial. Left alone, BOTH convert on 2026-08-13.

      Microsoft 365 E5 is a superset of Office 365 E5 and is the license
      actually assigned to the admin account, so O365 E5 contributes nothing
      operationally. Its recurring billing was turned OFF on 2026-07-16 and
      verified: the panel now reads "Expires on August 14, 2026" in place of
      "changes to paid subscription", which is the documented indication that
      recurring billing is off. Turning it off did not cancel — the trial still
      runs its full term.

      Microsoft 365 E5 recurring billing remains ON deliberately. It converts
      on 2026-08-13 at 1 license, 1 month, pay monthly unless extended or
      turned off. That is a decision point, not a deadline: month-to-month is
      cancellable at any renewal, so the lab need not be compressed to fit the
      trial window.

      UNVERIFIED, AND TESTED LIVE ON 2026-08-13: whether Microsoft 365 E5
      survives Office 365 E5 lapsing. If O365 E5 was structurally required to
      obtain M365 E5, it may or may not be required to retain it. An
      acquisition path is not normally an ongoing dependency and M365 E5 is a
      standalone SKU, so this is expected to be a non-event — but that is a
      vendor expectation, not an observation, and the distinction is the whole
      point of this register. Mitigation is free: recurring billing can be
      turned back on at any point before 2026-08-13 if M365 E5 shows any sign
      of depending on it.

  - id: POS-006
    lab: "01"
    setting: Users may join devices to Microsoft Entra ID
    location: Entra ID > Devices > Device settings
    state: All
    baseline: All
    kind: weakening
    production: Selected, scoped to a security group
    revisit: true
    verified: null
    note: >-
      Device identity is an authentication surface. Set to All, any credential
      — including a compromised one — can register an attacker-controlled
      device into the directory.

