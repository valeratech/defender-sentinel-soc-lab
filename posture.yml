  - id: POS-057
    lab: "13"
    setting: Email remediation reversibility - soft delete
    location: Defender > Explorer > Take action > Move or delete > Soft deleted items
    state: Recoverable by the mailbox owner from the standard Outlook client, no notification to the operator
    baseline: n/a - documented product behaviour; hard delete is the non-recoverable option
    kind: gap
    production: Hard delete where the mailbox may be compromised or the account is under investigation; soft delete only where the recipient is trusted
    revisit: true
    verified: 2026-08-01
    note: >-
      Measured end to end. Soft delete executed (Approval ID 6570a3, Action
      Center History, Approved, Completed), the message left the Inbox, and it
      was then restored by the mailbox owner via Deleted Items > Recover items
      deleted from this folder > Deletions. Two clicks, standard end-user UI, no
      admin involvement, no notification to the operator who remediated it.

      The wizard presents Junk / Deleted items / Soft deleted items / Hard
      deleted items as four adjacent radio buttons. The guide describes the
      distinction as recoverable versus permanent and frames it as operator
      convenience. Neither states WHO can recover.

      Operationally this matters most in the case remediation exists for: a BEC
      or phishing message in a mailbox that is compromised or whose owner is
      complicit. Soft-deleting it leaves the message one click from restoration
      by the account under investigation, and the Action Center still reads
      Completed.

      Nothing here is broken. Soft delete is documented as recoverable and that
      is its purpose. The gap is that the surface presenting the choice does not
      surface the consequence.

