    note: >-
      Off is the shipped state, not a decision made here. The gap is worth
      recording because presets are the only configuration that stays current
      automatically - Microsoft updates their values as its recommendations
      change, where a custom policy drifts from the day it is created.

      The absence is stronger than the toggle suggests. Get-EOPProtectionPolicyRule
      and Get-ATPProtectionPolicyRule both return NOTHING - not State: Disabled,
      no object at all. The rule objects are created only when a preset is first
      enabled in the portal. So the portal renders two toggles reading off for
      configurations that do not exist, and PowerShell cannot distinguish "never
      enabled" from "does not apply" because both are silence (row 42).

