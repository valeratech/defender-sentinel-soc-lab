      changes it.

  - id: POS-028
    lab: "03"
    setting: VM guest-agent extension channel
    location: Azure > (VM) > Run command / VMAccess; guest agent status
    state: Guest agent reports Ready (2.7.41491.1216); Run Command and VMAccess extension operations accept and then hang without completing
    baseline: A Ready agent services extension requests
    kind: gap
    production: Monitored agent health that distinguishes "Ready" from "servicing extensions", so a wedged extension channel is detected rather than discovered mid-task
    revisit: true
    verified: 2026-07-18
    note: >-
      Found while onboarding. The intended onboarding method was the local
      script executed as SYSTEM via Azure Run Command, chosen to keep an
      interactive privileged session off the endpoint (POS-021). Run Command
      accepted the script and never returned. A later password-reset via the
      VMAccess extension behaved identically: the control plane reported the
      operation InProgress and looped indefinitely without completing.

      Meanwhile control-plane reads about the VM returned instantly, and the
      guest agent reported Ready, version 2.7.41491.1216. So the agent is up for
      status but not executing extensions. "Ready" is not evidence the extension
      channel works — the same shape as POS-011's "Available" and POS-026's
      role that "appears complete". A status field answered a narrower question
      than the one being asked.

      Consequence for Lab 03: the SYSTEM elevation path was unavailable, forcing
      the interactive labadmin route via Azure Bastion. That is the divergence
      recorded in the Lab 03 design decisions and the configuration-inventory
      divergence table — intended SYSTEM, forced to the RID-500 local admin
      (POS-025) that the VM design otherwise routes around.

      Not diagnosed to root cause. May clear on an agent restart or VM redeploy;
      neither attempted, because the interactive path completed the lab. Left
      open deliberately: a VM whose extension channel is wedged is a real state
      and worth confirming persists before treating it as resolved.

  - id: POS-029
    lab: "03"
    setting: Endpoint sensor (Defender for Endpoint onboarding)
    location: security.microsoft.com > Assets > Devices; DeviceInfo
    state: LAB-WIN11-01 onboarded, sensor Active, streaming; ConnectivityType Streamlined; onboarded via local script
    baseline: Not onboarded - device present in directory, absent from Device* tables
    kind: hardened
    production: Onboarding delivered by an assigned Intune EDR policy across a fleet, not a per-device local script; the local script is capped at 10 devices and carries no ongoing management
    revisit: true
    verified: 2026-07-18
    note: >-
      The SOC's first endpoint. Before this the Device* advanced-hunting tables
      were empty; after it they are the data plane later labs read from.

      Onboarded by local script because the scalable Intune path (module 26) is
      structurally foreclosed here: it requires an Intune-enrolled device, and
      POS-022 records that enrolment never fires. Even were that fixed, the
      device-risk-to-compliance path is independently off (POS-011) and the VM
      cannot attest (POS-018, no vTPM). Three independent breaks; local script
      is the only available path.

      Measured latencies, all normalised to UTC and all at or under the vendor
      numbers: onboard to device-in-inventory ~2 min (vendor 5-30 min); onboard
      to first telemetry ingested ~3.5 min (FirstEvent 08:30:16Z, FirstIngest
      08:33:52Z); detection test to alert ~2 min (vendor "a few minutes"). These
      measured numbers are the finding; the vendor ranges are recorded only for
      comparison.

      Connectivity type Streamlined, chosen at download and confirmed applied
      via DeviceInfo.ConnectivityType rather than assumed from the selection.

      The device is now watched but not governed - it emits telemetry and obeys
      no policy, because onboarding is telemetry and enrolment (the management
      path) never completed. An analyst inheriting this environment sees a fully
      reporting endpoint and could assume it is managed. It is not. That gap is
      the whole point of keeping onboarding and enrolment as separate entries.

  - id: POS-030
    lab: "05"
    setting: Device group, automation level, and scoped delegation
    location: security.microsoft.com > Settings > Endpoints > Permissions > Device groups
    state: Group "Lab Client Machines", rule Name starts-with the lab prefix, remediation Semi (approval required for non-temporary folders), user access scoped to an Entra group holding the analyst identity
    baseline: No custom groups - all devices in "Ungrouped devices (default)", which runs Full remediation
    kind: hardened
    production: Groups scoped by security-group-driven membership and rank, remediation level matched to each device's role, and access delegated to teams rather than a single identity
    revisit: true
    verified: 2026-07-19
    note: >-
      Two boundaries in one object: a policy boundary (the remediation level
      governs every member) and an access boundary (only assigned identities
      manage members). Semi remediation was chosen because this tenant's only
      endpoint is also its detection-test rig - Full could quarantine a test
      artifact before it is observed; No-automated-response would also drop the
      device from automatic attack disruption. Semi keeps response capability
      and preserves evidence.

      Membership propagation measured: Apply at 06:11, committed by 06:39 - under
      28 minutes, at or under the vendor's 30-60 minute window.

      The finding with consequences: for the whole propagation window the device
      was NOT in this group. It sat in "Ungrouped devices (default)", which runs
      FULL remediation - the opposite of the Semi chosen here. The rule previewed
      as matching instantly while committed membership lagged, so every visible
      signal said "configured" while the effect (and the intended remediation
      level) was not yet in force. POS-011's family, sharpest instance: the
      fallback does not do nothing, it does the specific thing the design chose
      to avoid. Do not test against a device until membership commits, not merely
      until the rule previews.

      Scoped delegation composed across models: the analyst identity (POS-027,
      Unified RBAC per POS-026, unlicensed) gained scoped visibility of the device
      as a member of this group, via an Entra security group bound to the legacy
      device group. That composition was the lab's open prediction and it resolved
      yes.

      The exclusive half of scoped access - analyst DENIED a device outside the
      group - is un-runnable with one device and is the reason this entry stays
      revisit:true. A scope that has never excluded anything has not been shown to
      scope. Needs a second, deliberately out-of-group device to close.

  - id: POS-031
    lab: "06"
    setting: Attack Surface Reduction rules
    location: Set via PowerShell Add-MpPreference on the device; viewed at security.microsoft.com > Reports > Attack surface reduction rules
    state: Two rules set to Block - WMI event-subscription persistence, and process creation via PSExec/WMI. Both enforcing and confirmed firing.
    baseline: No ASR rules configured
    kind: hardened
    production: ASR deployed by Intune policy across the fleet with a staged audit-then-block rollout, visible in the ASR report; not per-device local PowerShell
    revisit: true
    verified: 2026-07-19
    note: >-
      Two rules configured, both Block, and demonstrated firing in both audit and
      block states on one rule with an identical benign trigger (a WMI process
      create). Audit: action allowed, silent, local event 1122, cloud ActionType
      ...Audited. Block: action refused, user notification, event 1121,
      ...Blocked. Both events coexist in one query, distinguishable only by the ID
      / suffix - the trap the tooling invites.

      The headline finding: the Defender ASR report shows this device as "Rules
      off" - 0 in block, 0 in audit, 18 turned off - while both rules were
      actively blocking. The Detections view showed 0 with all filters set to Any.
      Advanced hunting, the device timeline, and the local event log all carried
      the events. Cause is scope, not lag - CONFIRMED 2026-07-27. The ASR REPORT
      is built around policy-managed (Intune/MDM) rules; rules set locally via
      Add-MpPreference enforce on the endpoint but are invisible to THAT REPORT's
      configuration and detection views. An analyst trusting the dashboard would
      read the box as unprotected and re-deploy while protection runs.

      AMENDED 2026-07-27 - "invisible to the console" was too broad and is
      disproved by counterexample. Microsoft Secure Score is a Defender console,
      names Defender for Endpoint as its product, and shows BOTH rules Completed
      at 9/9 points. Its history recorded the transition: each rule logged at 0/9
      "has become relevant" on 2026-07-18 and 9/9 "points gained by completing ...
      Great work!" on 2026-07-19, the day Lab 06 was built. Tamper Protection did
      the same, 0/8 to 8/8. That transition also settles scope-vs-lag BY
      ELIMINATION rather than by the two verifications previously pending: if the
      configuration had never reached the Defender cloud, Secure Score could not
      have logged it changing. The corrected finding is stronger than the original
      - not one console blind to a local rule, but TWO CONSOLES IN THE SAME
      PRODUCT READING THE SAME CONFIGURATION AND DISAGREEING COMPLETELY, one
      reporting 18 rules off and zero in block while the other awards full points
      and timestamps the moment they were set. An analyst cannot tell which is
      right without going to the endpoint. Caveat: Secure Score read Completed on
      2026-07-27 with both VMs deallocated, so it reports last-known
      configuration, not live state.

      This is a direct downstream consequence of POS-022. Because Intune enrolment
      never fires, local PowerShell is the only available way to set ASR here -
      and that is precisely the path the reporting UI cannot see. A Lab 01 defect
      silently governs the visibility of every ASR rule set in Lab 06.

      Secondary: ASR blocks are recorded as telemetry, not raised as alerts.
      Neither event reached Incidents & Alerts. A successful block is treated as
      resolved, so ASR visibility requires hunting or the ASR report - never the
      alert queue.

      Two PowerShell literacy traps recorded in configuration-inventory.md: Get-
      MpPreference does not return ASR rules in entry order (positional pairing
      required, or Block reads as Audit); and Add-MpPreference appends while Set-
      MpPreference replaces.

      End state both Block; either rule can be set to AuditMode later - noted so
      the register and the device stay in sync. Preconditions from earlier labs:
      AV Normal mode (POS-029/Lab 03) makes rules enforce; Semi remediation
      (POS-030) kept the block from being auto-quarantined mid-test.
  - id: POS-032
    lab: "04"
    setting: Microsoft Sentinel workspace and Defender XDR ingestion
    location: Azure > Log Analytics workspace law-soc-lab; Microsoft Sentinel; Data connectors
    state: Sentinel enabled on law-soc-lab (West US, PAYG). Defender XDR connector Connected/Primary, forwarding incidents and alerts only. Raw Device* event streaming OFF.
    baseline: No SIEM - Defender telemetry queryable only in Defender's own data lake
    kind: hardened
    production: SIEM with sources beyond Defender, ingestion budgeted against a commitment tier once volume is known, and retention set to policy
    revisit: true
    verified: 2026-07-19
    note: >-
      The section capstone - the aggregation layer over every prior lab. Endpoint
      (Lab 03 sensor) to Defender to XDR to Sentinel, proven with a live detection
      test: a SecurityIncident arrived carrying ProviderName Microsoft XDR, the
      proof it came through the connector. Defender-to-Sentinel sync measured at
      ~2 minutes (UTC-converted; the local-vs-UTC timestamp trap applies a fifth
      time).

      Cost-safe by design and verified. Ingestion is the only meaningful Sentinel
      cost and it is volume-based. Only the free alert/incident sync is enabled;
      raw Device* event streaming is OFF, confirmed by DeviceEvents failing to
      resolve as a table in the Sentinel Logs blade (it resolves fine in Defender
      Advanced Hunting - different store). The trial (2026-07-19 to 2026-08-19)
      covers 10 GB/day on both Sentinel and Log Analytics; the conservative
      connector keeps usage far under that.

      Architecture recorded in Lab 04 for reuse: a sensor produces telemetry
      (on-device, the source), a connector moves it (cloud-to-cloud, no software);
      Defender Advanced Hunting and Sentinel Logs both speak KQL but query
      different stores (Defender's free raw lake with column Timestamp vs the
      billed Log Analytics workspace with column TimeGenerated holding only
      forwarded data). The project's existing kql/ queries are portable across
      both - language transfers, store and cost change.

      Two behaviours worth remembering: the Defender XDR connector is forward-only
      (historical incidents do not backfill - prove flow with a fresh event); and
      the incident wrapper (SecurityIncident) syncs ahead of the discrete
      SecurityAlert, so query SecurityIncident or search * to confirm flow, not
      SecurityAlert alone. Permissions note: subscription Owner was required for
      auto-onboard - Global Administrator (a directory role) is not Azure RBAC
      (POS-024).

  - id: POS-033
    lab: "07"
    setting: Windows Security Events ingestion via Azure Monitor Agent
    location: Azure > Monitor > Data Collection Rules (dcr-winsec-labsrv); VM WIN-SRV-DEFENDER-01 > Extensions (AzureMonitorWindowsAgent)
    state: DCR dcr-winsec-labsrv collecting Common-tier Windows Security events from WIN-SRV-DEFENDER-01 into the SecurityEvent table. AMA auto-installed via the DCR association. Pipeline verified with live telemetry.
    baseline: No agent-based ingestion - only the Defender XDR connector (POS-032, alerts/incidents)
    kind: hardened
    production: DCR scoped by XPath to the exact event IDs detected on, across the managed fleet; Defender for Servers P2 enabled so SecurityEvent draws its 500 MB/day/server allowance; WEF/WEC for machines where per-machine AMA is impractical
    revisit: true
    verified: 2026-07-25
    note: >-
      The first agent-based ingestion in the project. Distinct from POS-032's
      connector path: this is the Azure Monitor Agent collecting a machine's own
      Windows Security log via a Data Collection Rule, landing in the billed
      SecurityEvent table. AMA auto-installs when the DCR is associated to the VM
      (installed in under 5 minutes). SCAgentChannel reads Direct - the per-machine
      path, not WEF/WEC. Data lands in SecurityEvent, not WindowsEvent.

      Cost decision - Common tier, not All. The Windows Security log is high-volume
      and SecurityEvent bills fully here: the 500 MB/day/server free allowance
      exists only under Defender for Servers Plan 2, which this environment does
      not have (Defender for Cloud declined at Lab 04). So the DCR tier is the only
      cost control, and Common (curated security IDs) was chosen over All (the
      firehose). This is the DCR-as-cost-lever principle in its most consequential
      form.

      Four findings recorded in Lab 07. (1) Direct-AMA path confirmed via
      SCAgentChannel Direct, landing in SecurityEvent; the WindowsEvent/WEF half is
      documented but not observed (no collector topology). (2) Hostname truncation:
      the Azure name WIN-SRV-DEFENDER-01 (19 chars) exceeds the 15-char Windows
      NetBIOS limit, so the Computer field reads WIN-SRV-DEFENDE - an exact-match
      filter on the full name returns nothing. (3) Machine-context events:
      WORKGROUP\ account, AccountType Machine, confirming the VM is WORKGROUP-joined
      (no AD, consistent with the Entra-only environment). (4) 4624 does not mean a
      human logged in: on a VM started but never signed into, the only successful
      logons were 2x LogonType 5 (service, SYSTEM), zero interactive (the Type 2
      query returned empty) - the meaning is in LogonType, not the raw 4624 count.

      VM deployed cost-safe: Standard_D2s_v3 (smallest available), smalldisk image,
      Standard HDD, Security type Standard (POS-018 parity), inbound None, no public
      IP (dissociated and deleted), Bastion-as-labadmin access, auto-shutdown 23:00
      Pacific, Manual patching, boot diagnostics off. Access posture is deliberately
      BETTER than VM 1: inbound None and no public IP, versus VM 1's internet-facing
      RDP (POS-019). Standing cost note: Bastion bills more than the VM while running
      - a per-session teardown decision.

      Deferred: Endpoint Threat Protection Essentials (the SecurityEvent analytics
      rules) did not auto-install with the Windows Security Events solution, contrary
      to source guidance - ingestion does not need it; detection on this data is
      deferred to the alerts/incidents work later in the course.

  - id: POS-034
    lab: "08"
    setting: Entra ID and Azure Activity connectors
    location: Azure > Subscription > Activity log > diagnostic setting (activity-to-law-soc-lab); Entra ID > Monitoring & health > Diagnostic settings (AzureSentinel_law-soc-lab)
    state: Both connectors configured and verified flowing. Azure Activity via a manual diagnostic setting (Method B) after the policy path (Method A) failed twice. Entra ID sign-in/audit/risk logs via the connector's diagnostic setting. AzureActivity and SigninLogs both populated in the workspace (re-verified 2026-07-26).
    baseline: No control-plane or identity ingestion - only Defender XDR (POS-032) and Windows events (POS-033)
    kind: hardened
    production: Azure Activity via policy across all subscriptions with auto-enrollment; Entra ID with the log types matched to real detection needs; risk tables backed by active Entra ID Protection
    revisit: true
    verified: 2026-07-25
    note: >-
      The two foundational first-party connectors - control-plane (AzureActivity)
      and identity (SigninLogs/AuditLogs/risk). Both were installed as Content Hub
      solutions earlier; this records the configuration that made them flow, and
      the verification by querying tables rather than trusting the connector
      status label ("connected is not flowing").

      Connector-tiers model (the analysis grounding Labs 04/07/08): config effort
      scales with how foreign the source is to Sentinel. Defender XDR (Lab 04) is
      the same platform - auto-connected. AMA/Windows events (Lab 07) is your
      resource on an external disk - agent + DCR. Azure Activity and Entra ID
      (this lab) are separate Azure/Entra services with their own logging systems
      - connecting them means reconfiguring THOSE services to export (a diagnostic
      setting or policy), plus licensing. This is why these two surface the
      "connected is not flowing" warning: the connector page reads connected while
      the real work sits on the source service.

      Azure Activity - Method A failed, Method B worked, and B was the right
      choice. The Azure Policy wizard (Method A, the guide's recommended path)
      failed TWICE: "you need to log in" at submission, with Policy > Assignments
      confirming 0 policy assignments both times. Not user error - the wizard's
      managed-identity creation needs a privileged token and the session kept
      expiring. The manual diagnostic setting (Method B) succeeded first try.
      Analysis: for a SINGLE subscription, Method B is architecturally
      appropriate, not a fallback; Method A's machinery (policy + managed identity
      + remediation + enforcement) only earns its complexity at multi-subscription
      scale. Decision rule: count subscriptions.

      CORRECTED 2026-07-26 - SigninLogs vs EntraIdSignInEvents. This entry
      originally recorded the two as the same sign-in data under two schema names,
      one per query surface. That was inference, and it was wrong. Running the
      identical "search * | where TimeGenerated > ago(24h) | summarize count() by
      $table" on both portals on 2026-07-26 returned BOTH tables in the Defender
      result (SigninLogs 6, EntraIdSignInEvents 972) and ONLY SigninLogs in the
      Azure/Log Analytics result. Two names for one dataset cannot resolve side by
      side in one query and disagree about how many rows exist. They have
      different PRODUCERS, not different names. SigninLogs and AuditLogs are
      workspace tables written by the Entra diagnostic setting, scoped by the four
      log types selected here (interactive sign-ins only), and billable.
      EntraIdSignInEvents, EntraIdSpnSignInEvents, GraphAPIAuditEvents,
      EmailEvents, EmailUrlInfo and IdentityInfo are Defender XDR lake tables,
      written by XDR independently of this connector, and free. The decisive
      evidence was already in this lab and went unread: the XDR tables carry
      service-principal and Graph activity, which are exactly the high-volume log
      types this connector DECLINED, so they cannot be connector-fed. The original
      empty SigninLogs is explained by the Entra propagation lag (~10-15 min) that
      this same entry documents two paragraphs down - the correct explanation was
      sitting beside the wrong one.

      The store-partition method (the finding that replaces the one above).
      Running one identical search * table census on both portals and diffing the
      two table lists cleanly separates the free Defender XDR lake from the
      billable Log Analytics workspace: what appears in the Azure run is
      workspace-resident and meterable, what drops out is XDR-native and free.
      Measured 2026-07-26 - workspace: SecurityEvent, Heartbeat, Usage,
      AzureActivity, SigninLogs. XDR-only: GraphAPIAuditEvents (3578 events, the
      volume that prompted the check and bills nothing), EntraIdSignInEvents,
      EntraIdSpnSignInEvents, EmailEvents, EmailUrlInfo, IdentityInfo. The method
      is free, repeatable, and answers a cost question by measurement instead of
      inference. IdentityInfo landing XDR-side also establishes that it is not
      evidence of UEBA running in this workspace - worth knowing before the
      behavioural-analytics section rather than after. Query kept at
      kql/sentinel/store-partition-diff.kql.

      Timestamp trap, sixth occurrence - and the cleanest measurement of it. The
      two exports of the same rows disagreed by exactly 7 hours across three
      tables (SecurityEvent, Heartbeat, AzureActivity), matching to the second:
      the Defender export rendered local time, the Azure export rendered UTC and
      labelled its column "Latest [UTC]" where the Defender export left it
      unlabelled. That column header is a free tell. Prior occurrences were two
      different events compared across surfaces; this one is the same rows
      exported twice, so the offset is measured rather than inferred.

      Licensing test PASSED - conclusion unchanged, evidence corrected. Entra
      sign-in ingestion needs P1/P2 and the E5 trial's P2 is live. The 489
      EntraIdSignInEvents originally cited as proof establishes nothing about this
      connector, being XDR-native and present regardless of it. The actual proof
      is SigninLogs populated in the WORKSPACE - 7 events, latest 2026-07-26 21:56
      UTC, that last one being the operator's own sign-in to the Azure portal
      minutes earlier, which also demonstrates the interactive-only scope working
      as selected. The risk tables (AADRiskyUsers/AADUserRiskEvents) may stay
      empty even when licensed - they populate only on actual risk detection, and
      a quiet lab tenant produces none; empty risk tables are not a licensing
      failure. AuditLogs was selected but absent from a 24h window on 2026-07-26;
      a quiet tenant with no directory changes was the likely reason, recorded as
      unconfirmed rather than assumed. CLOSED 2026-07-29: AuditLogs carries data.
      The connector was fine and the tenant was quiet, which is what the entry
      declined to assume at the time.

      Both connectors are platform diagnostic settings - VM-independent - so they
      keep ingesting with the VM and Bastion deallocated. Cost: low lab volume;
      the section's two ingestion levers (connectors coarse on/off, DCRs fine
      filter-at-source) are the disciplines already applied in Labs 07-08.
      Measured billable surface as of 2026-07-26 is five tables and negligible
      volume against the 10 GB/day trial allowance.
  - id: POS-035
    lab: "09"
    setting: Unified audit log ingestion
    location: Exchange Online PowerShell (Set-AdminAuditLogConfig); Defender portal > System > Audit
    state: UnifiedAuditLogIngestionEnabled = True, set 2026-07-26 by cmdlet after the portal path failed
    baseline: False - this tenant recorded nothing until this lab
    kind: hardened
    production: Enabled at tenant creation, before any activity worth auditing occurs; audit retention policy set deliberately rather than inherited
    revisit: false
    verified: 2026-07-26
    note: >-
      Attack simulation reporting depends on this, and the Simulations tab says so
      in a banner that names a quarter of the reason. The full chain is five links
      and no course guide mentions any of it: simulation reporting needs unified
      audit logging, which needs a hydrated Exchange organisation (POS-036), which
      new/trial tenants do not have, and which propagates unevenly across Exchange
      backend servers.

      Discovered because the banner appeared, not because anything failed. The
      campaign launched cleanly, status In progress, no errors anywhere. Had the
      banner been dismissed the report would have been empty and the lab would
      have concluded that attack simulation does not report.

      The portal could not do this. System > Audit rendered TWO independent faults
      at once - "Sorry, we're having trouble figuring out if activity is being
      recorded" and "Failed to load data" - and offered a "Start recording user
      and admin activity" button. That button renders both when auditing is
      genuinely off AND when the page cannot determine state, so it is not
      evidence either way. Clicking it produced a "Complete organizational setup"
      prompt, accepting that produced a Client Error, and the page then unlocked
      its form and removed the button while STILL being unable to report state. UI
      advanced, operation did not.

      Resolved by cmdlet, which answered instantly what the page could not answer
      at all: Get-AdminAuditLogConfig returned False. The state was always
      readable; only the page could not read it. Prior state therefore measured,
      not assumed - the failed portal attempt changed nothing.

      ENDPOINT TRAP. Get-AdminAuditLogConfig also exists in Security & Compliance
      PowerShell, where UnifiedAuditLogIngestionEnabled reads False even when
      auditing is ON (Microsoft Learn, audit-log-enable-disable). Run in the wrong
      endpoint it returns a permanently false value with nothing to distinguish it
      from a true one. This is the same shape as POS-034's corrected finding (two
      stores behind one query language) and the Lab 04 surface distinction - a
      third instance, now in PowerShell rather than KQL. Same command, different
      service endpoint, different meaning.

      Vendor claim vs measurement: the cmdlet warns "could take up to 60 minutes
      to take effect" and Microsoft Learn separately states audit events may take
      several hours to become searchable. Those are two different delays and only
      the first gates event capture. The property read back False immediately
      after a successful Set and True on a later read.

      Why it was off is not established. One secondary source states trial tenants
      are not auto-enabled for audit logging unlike new enterprise tenants, which
      fits this tenant exactly, but that is a blog claim rather than Learn and is
      recorded as a candidate explanation only.

      Cost: none. Audit data lives in the Microsoft 365 substrate, not in law-soc-
      lab. The billable surface measured on 2026-07-26 (POS-034) is unchanged. It
      becomes an ingestion cost only if the Office 365 connector is later added to
      Sentinel, which is a separate decision.
  - id: POS-036
    lab: "09"
    setting: Exchange organisation customization (tenant hydration)
    location: Exchange Online PowerShell (Get-OrganizationConfig / Enable-OrganizationCustomization)
    state: IsDehydrated = False. Irreversible; confirmed already applied when first read on 2026-07-26
    baseline: True - new tenants ship dehydrated, sharing consolidated configuration objects rather than owning unique copies
    kind: default
    production: Hydration performed deliberately and recorded, rather than triggered as a side effect of the first admin who happens to change a shared object
    revisit: false
    verified: 2026-07-26
    note: >-
      New Microsoft 365 tenants are provisioned dehydrated - they share an out-of-
      the-box configuration for objects like role assignment and mailbox policies
      instead of receiving unique copies. Before any of that can be altered,
      Enable-OrganizationCustomization must move the tenant to a customizable
      state. It runs explicitly, or implicitly when an admin changes a standard
      setting for the first time. It is a one-time operation with no way to reset
      IsDehydrated.

      Recorded as a posture entry because it is an IRREVERSIBLE tenant-level state
      change and because it is invisible: nothing in the portal surfaces hydration
      state, and the tenant had already crossed it before this lab read the value.
      In a tenant expiring 2026-08-13 the irreversibility costs nothing, which is
      why it was accepted without hesitation - that is a judgement about this
      environment, not a general one.

      THE FINDING - a property read is not a capability test. Within one
      PowerShell session, three tests disagreed. Get-OrganizationConfig returned
      IsDehydrated False. Enable-OrganizationCustomization returned "not required,
      organization is already enabled for customization." And Set-
      AdminAuditLogConfig failed with
      InvalidOperationInDehydratedContextException, naming target
      AdminAuditLogConfig. Two sources said hydrated; the one operation that
      actually attempted work said otherwise.

      Resolved by waiting. Roughly thirty minutes later the identical Set executed
      and returned only its warning. So the org-level flag was true while a
      specific consolidated object beneath it had not yet been instantiated - per-
      object propagation behind an org-level boolean. Measured window: the object
      rejected the write at 00:23:43 GMT and accepted it within the next ~30
      minutes. Microsoft documents org hydration and says nothing about
      propagation behind it; this number does not exist in the vendor
      documentation.

      The three exception timestamps also crossed a different backend server than
      the successful reads, which is consistent with distributed propagation but
      was not isolated and is not claimed as the cause.

      Generalises past Exchange: an org-level status property answered "yes" for a
      capability that was not yet usable. That is POS-011's shape - configured is
      not effective - reached from a property rather than a portal label.
  - id: POS-037
    lab: "09"
    setting: Attack simulation campaign - My First Attack Simulation Training
    location: Defender portal > Email & collaboration > Attack simulation training > Simulations
    state: Credential Harvest, Netflix account suspension global payload, all-users targeting with the admin excluded, Microsoft training assigned, launched 2026-07-26 16:20:02, ends 2026-07-28 16:20:02, training due 2026-08-04
    baseline: No simulation had ever run; Recent Simulations empty
    kind: hardened
    production: Pilot to a small controlled group first, payload indicators enabled, positive reinforcement delivered, and repeated campaigns so the trend rather than any single compromise rate is the metric
    revisit: true
    verified: 2026-07-26
    note: >-
      The first Defender for Office 365 capability in this lab and the first that
      tests people rather than machines. MDO Plan 2 rides on the E5 trial; no
      Azure resource, no VM, no ingestion cost.

      Scoping decision: all-users targeting plus an explicit exclusion of the
      admin, rather than selecting labuser directly. One extra click, two
      mechanics tested instead of one - whether all-users resolves correctly, and
      whether the exclusion list actually excludes. Both held: every denominator
      in the report reads /1.

      MEASURED RESULTS. Delivery ~1 minute after launch, to the Focused Inbox,
      bypassing tenant filtering entirely. First link clicked 2h55m11s and first
      credential entered 2h58m37s after launch (both operator-driven, so they
      measure nothing about the platform except that it recorded them). Training
      assignment notifications arrived ~90 seconds behind each trigger. Actual
      compromise rate 100%, predicted 37%, users who reported 0%.

      Two training modules were assigned, not one: "Business Email Compromise |
      ClickedPayload" and "Ransomware | Compromised". The recommendation engine
      assigns per BEHAVIOUR exhibited, not per user - confirmed three independent
      ways (two named modules in the report, two notification emails three minutes
      apart, two distinct assignmentId GUIDs in EmailUrlInfo).

      THE DETECTION FINDING - and it goes further than expected. Zero incidents
      and zero alerts over a one-week window, which was predicted: Microsoft
      exempts its own simulations, because a 5,000-user drill that raised 5,000
      incidents would bury the SOC that scheduled it. But the payload is also
      absent from EmailEvents and EmailUrlInfo entirely, while the training
      notifications either side of it are recorded normally in both. The tables
      were working; the payload is not in them.

      So attack simulation training tests USERS. It cannot validate detection,
      because it is engineered not to trigger it, and it cannot be hunted, because
      it leaves no telemetry to hunt. Two symmetrical misreadings follow: seeing
      no alert and concluding phishing detection is broken (it was told to stand
      down), or seeing no alert and concluding the tenant is covered (nothing
      about detection was exercised). Neither the course guide nor the portal says
      this anywhere.

      Two sending infrastructures, deliberately split. The drill came from
      templatern.com and landed the victim on sharepointle.com - a lookalike of
      sharepointonline.com, attacker-shaped and untelemetered. The notifications
      come from attacksimulationtraining.com, plainly labelled and recorded as
      ordinary mail. The typosquat is correct design: the address bar is where a
      trained user actually catches a credential harvest, so making it obviously
      Microsoft would invalidate the exercise. It also means allow-listing for
      simulations spans more than the sender domain - a tenant with strict DNS or
      egress filtering could deliver the mail and break the click, which would
      read as a user who did not engage rather than a control that intervened.

      Exemption is not total. Outlook still blocked remote content because the
      sender was not in Safe Senders. The simulation is exempt from FILTERING but
      not from client-side rendering protections - two mechanisms the guide's
      "harmless messages get through" framing collapses into one.

      What this campaign cannot show, foreclosed by the 2026-08-13 tenant expiry
      and by n=1: trend across campaigns, repeat-offender behaviour (needs
      consecutive compromises), and training-threshold reassignment at 90 days.
      Recorded as foreclosed rather than untested. A 100% compromise rate with one
      target is arithmetic, not a measurement.
  - id: POS-038
    lab: "09"
    setting: End-user notification delivery preferences (simulation-scoped)
    location: Attack simulation training > Launch wizard > Select end user notification
    state: Microsoft default notifications; positive reinforcement = Do not deliver; training reminder = Weekly; training assignment = delivered
    baseline: Same - all three are the pre-selected values, not chosen
    kind: default
    production: Positive reinforcement delivered, so that correctly reporting a phish is reinforced rather than met with silence
    revisit: true
    verified: 2026-07-26
    note: >-
      Inherited, not decided - recorded because documentation-standard.md section
      2 treats a silently inherited default as a finding when it is labelled as
      one.

      The consequence is asymmetric and works against the feature's purpose. A
      user who falls for the phish gets a landing page, two training modules, and
      weekly reminders. A user who correctly REPORTS it gets nothing at all,
      because positive reinforcement ships pre-set to Do not deliver. The
      behaviour the whole capability exists to encourage is the only one with no
      feedback path.

      Confirmed from the data rather than the wizard: the report shows "Positive
      Reinforcement Message Delivered 0/0". The denominator is zero, not one - the
      metric knows the notification was never in play, rather than recording a
      delivery that failed. Cleanest possible evidence for an inherited default.

      Not observed: the tenant-wide Settings tab (repeat offender threshold,
      training threshold). Those were never opened, so they are absent from this
      register rather than recorded from the guide's stated values.
  - id: POS-039
    lab: "09"
    setting: Phish landing page - payload indicators
    location: Attack simulation training > Launch wizard > Select phish landing page
    state: Microsoft Landing Page Template 1, payload indicators NOT enabled
    baseline: Same - off by default
    kind: default
    production: Payload indicators enabled, so the teaching moment annotates the specific cues that gave the message away
    revisit: true
    verified: 2026-07-26
    note: >-
      Observed on the landing page after compromise: the "Tips to identify the
      phishing message" panel was collapsed and empty, and the reproduced email
      below it carried no annotations - nothing marking the urgency language, the
      mismatched sender, the fake deletion deadline, or the lookalike domain.

      So the educational moment is a verbatim copy of the message that just fooled
      the user, with nothing pointing at why. The user is shown the evidence and
      left to infer the lesson. Enabling payload indicators is one checkbox in the
      same wizard step.

      An inherited default that measurably weakens the training value of the whole
      exercise, on the one screen the compromised user is guaranteed to read.

      Also observed: the template renders a broken companyLogo placeholder when no
      logo is uploaded, rather than degrading gracefully. Cosmetic, but it is the
      default experience.
  - id: POS-040
    lab: "09"
    setting: User reported settings (Outlook/Teams report button routing and feedback)
    location: Defender portal > Settings > Email & collaboration > User reported settings; Exchange Online PowerShell (*-ReportSubmissionPolicy / *-ReportSubmissionRule)
    state: Microsoft and my reporting mailbox, mailbox field blank (= global admin's mailbox, undisplayed). Policy object exists, submission RULE does not. All four user-feedback options off.
    baseline: Same - every value is the shipped default. The policy object itself did not exist until this page was first opened.
    kind: default
    production: A dedicated reporting mailbox specified explicitly and identified as a SecOps mailbox, success and results notifications on, and the routing destination verified by sending a test report rather than read off a page that cannot show it
    revisit: true
    verified: 2026-07-27
    note: >-
      Read-only visit to Defender > Settings > Email & collaboration > User
      reported settings during module 53. Nothing was saved and no Save exists for
      what was done. The page was opened, read, and left. Assigned to lab 09
      because these settings govern the "users who reported 0%" metric that lab
      measured, and because Microsoft's SecOps-mailbox guidance for this setting
      is specifically about Attack simulation training.

      OBSERVATION CREATED STATE. Get-ReportSubmissionPolicy returned
      DefaultReportSubmissionPolicy with WhenCreatedUTC = 2026-07-27 12:56:04,
      WhenChangedUTC identical. The tenant was created 2026-07-14, so this object
      did not ship with it - it was instantiated thirteen days later, roughly 44
      minutes after that morning's CI push, inside the window in which this page
      was first opened. Written once, never modified. A secondary source states
      that visiting the page for the first time creates the default report
      submission policy; this is the direct measurement of that claim. Microsoft
      Learn documents the resulting default state and does not mention that
      reading the page produces it. The consequence is uncomfortable and worth
      stating plainly: reading configuration can write configuration, so an audit
      is not necessarily a non-event.

      BLANK IS NOT UNSET, AND THE DESTINATION IS IN NEITHER OBJECT. The portal
      shows "Send reported items to: Microsoft and my reporting mailbox" with the
      mailbox field empty - confirmed placeholder, not a saved value, by the
      Suggested contacts autocomplete appearing on click. Per Microsoft Learn this
      blank field IS the documented default, and it means the reporting mailbox is
      the global admin's Exchange Online mailbox, which is not displayed on the
      page until after the first user in the organisation reports a message from
      Outlook. The cmdlets agree and sharpen it: the policy carries
      ReportJunkToCustomizedAddress True and ReportPhishToCustomizedAddress True -
      send to a customised address - while Get-ReportSubmissionRule, the object
      that would define that address, returns nothing at all. Configuration split
      across two objects, one absent, and the operative value present in neither.
      The only way to learn where reports go is to send one.

      POS-011's shape at a third polarity. POS-011 is a healthy status over a dead
      control. POS-036 is an error over an operation that succeeded. This is a
      BLANK FIELD OVER A LIVE DESTINATION - reports have a real recipient and no
      surface will tell you which until the control is exercised.

      FOUR DEFAULTS, ALL SILENT ON SUCCESS. Ask the user to confirm before
      reporting: off. Show a success message after the message is reported: off.
      Automatically email users the results of the investigation: off. Positive
      reinforcement notification (POS-038): Do not deliver. A user who correctly
      reports a phish receives no prompt, no confirmation, no result, and no
      reinforcement - four independent inherited defaults across two feature
      areas, all pointing the same way. A user who FAILS gets a landing page, two
      training modules, and weekly reminders. The tenant is configured, by
      inheritance rather than decision, to give zero feedback for the behaviour
      the capability exists to encourage. This does not explain lab 09's 0%
      reported - labuser simply did not report - but it explains why no one would
      learn that reporting is worth doing.

      SECOPS MAILBOX GAP, UNRESOLVED. Microsoft Learn instructs that the reporting
      mailbox be identified as a SecOps mailbox in the advanced delivery policy,
      and states this is especially important when Attack simulation training is
      in use, because otherwise a user-reported message might trigger a training
      assignment by the simulation product. This tenant's reporting mailbox is the
      global admin's by default and is NOT configured as a SecOps mailbox, while
      the lab 09 campaign ran live until 2026-07-28 16:20. The interaction was not
      tested and reporting the simulation would have falsified lab 09's committed
      0% figure. Recorded as a known unexercised interaction rather than a
      demonstrated one.

      Confirmed and requiring no action: built-in Outlook Report button selected
      over a non-Microsoft add-in (EnableThirdPartyAddress False), Monitor
      reported messages in Outlook on, Monitor reported items in Microsoft Teams
      on, reporting from quarantine allowed, EnableReportToMicrosoft True.
      Submissions baseline clean on 2026-07-27 - Emails 0 pending / 0 completed
      and User reported 0 across all four categories over a 7-day window, so any
      future report has an unambiguous before-state.

      The User reported tab classifies reports into four categories - Threats,
      Spam, No threats, and SIMULATIONS. Microsoft treats a user's report of its
      own drill as a distinct type rather than folding it into Threats. Set
      against lab 09's finding that the simulation payload leaves no EmailEvents
      or EmailUrlInfo row, the asymmetry is notable: the message is invisible to
      hunting, but a user's report of it has a dedicated counter waiting.

      Timestamp trap, eighth occurrence, and the first with a labelled companion
      property sitting beside the ambiguous one. WhenCreated read 5:56:04 AM and
      WhenCreatedUTC read 12:56:04 PM - exactly seven hours, the same offset
      measured across the two portal exports on 2026-07-26. Every prior occurrence
      required inferring the offset from context; Exchange objects carry both
      forms and name one of them. Read the *UTC properties.
  - id: POS-041
    lab: "06"
    setting: Enforcement scope (MDE security settings management)
    location: Defender portal > Settings > Endpoints > Configuration management > Enforcement scope
    state: Off - 'Use MDE to enforce security configuration settings from Intune' disabled. Observed 2026-07-27, not changed.
    baseline: Same - off is the shipped default
    kind: default
    production: Enabled where devices are not Intune-enrolled, so security configuration is policy-managed and therefore visible to the consoles that only read policy-managed state
    revisit: true
    verified: 2026-07-27
    note: >-
      Discovered 2026-07-27 while reviewing Settings > Endpoints during module 55.
      Read-only; the toggle was NOT changed. MDE security settings management lets
      Defender for Endpoint enforce security configuration on devices that are, in
      the portal's own words, "not yet enrolled to Intune". It requires a matching
      switch in Intune's Microsoft Defender for Endpoint connector settings - the
      same connector page that carries POS-011's Windows compliance toggle. Both
      are off.

      WHY IT MATTERS - it corrects an asserted absence in Lab 06. That lab's
      design table states that Intune needs an enrolled device (POS-022, enrolment
      never fires), GPO needs AD, and therefore "PowerShell is the only available
      path". That was asserted, not checked. This is a second path, and it exists
      specifically for the unenrolled case this tenant is in. The door was closed,
      not absent - and nobody tried the handle.

      The consequence runs deeper than a rationale. Had this been on, the two ASR
      rules could have been deployed as POLICY-MANAGED rather than local, which is
      exactly the class the ASR report can see. POS-031 - the most consequential
      finding in this repository - describes a report blind to locally-set rules.
      That finding is real and stands, but it exists because of a switch that was
      off and openable, not because of a foreclosure. A different starting
      configuration would have produced a different lab and no finding at all.

      NOT TESTED, deliberately. Enabling it buys nothing until there is an
      endpoint to enforce against - both VMs are deallocated - and it would put an
      unexercised change into this register. It is also two switches, not one, the
      second being on the POS-011 connector page. Deferred to the batched session
      that also covers custom detections and analytics rules, where a live
      endpoint is needed anyway.

      When it is tested, it is a DIRECT TEST OF POS-031's MECHANISM: deploy the
      same two rules as policy and see whether the ASR report begins showing them.
      Success moves "the report is scoped to policy-managed rules" from well-
      supported inference to demonstrated fact. Predict before testing: policy-
      managed ASR may conflict with the locally-set rules already on the box, and
      that interaction should be reasoned about in advance rather than discovered.

      Adjacent observation, same settings area: Intune Permissions is empty - no
      Entra groups have ever been granted Endpoint Security permissions in Intune.
      Consistent with the rest of the Intune-side foreclosure and recorded so the
      absence is on the record as observed rather than assumed.
  - id: POS-042
    lab: "03"
    setting: Defender XDR email notification rules (Incidents / Actions / Threat analytics)
    location: Defender portal > Settings > Microsoft Defender XDR > Email notifications
    state: No rules on any of the three tabs. Observed 2026-07-27, not changed.
    baseline: Same - empty is the shipped default
    kind: gap
    production: At least an incident-creation rule and an Actions rule to a monitored SecOps address, configured before the first real detection rather than after it
    revisit: true
    verified: 2026-07-27
    note: >-
      Observed 2026-07-27 during module 55, read-only, nothing changed. Defender
      XDR > Settings > Microsoft Defender XDR > Email notifications carries three
      tabs - Incidents, Actions, and Threat analytics. ALL THREE ARE EMPTY. No
      notification rule of any kind has ever existed in this tenant.

      So nobody is emailed when an incident is created, when a remediation action
      needs approval, or when a threat relevant to this tenant is published. This
      is the shipped default across all three, not a decision.

      Two things make it concrete rather than theoretical. Lab 03 produced a real
      incident on 2026-07-18 and nothing told anyone - it sat in the queue until
      someone happened to look. And the Action center guidance states that pending
      actions hold up the automated investigation until they are resolved, while
      nothing would announce that there are any to resolve.

      THE CONTRAST WORTH KEEPING: the Azure budget notification path in this same
      project is VERIFIED WORKING - an alert fired and was received. The cost
      control notifies. The security controls do not. Same tenant, same operator,
      opposite outcomes, and both by default rather than by decision.

      This is the seventh inherited silent default recorded across four feature
      areas, after positive reinforcement, confirm-before-reporting, success
      message and results email (POS-038, POS-040). Every one is a communication
      path that exists and is switched off. The pattern is now large enough to be
      the finding: Microsoft ships the security consoles quiet, and a tenant that
      has configured nothing will be told nothing.

      Not enabled here. Turning it on would need a recipient address, and this
      project keeps addresses out of the repository; the state is recorded as
      inherited rather than corrected. In production this is among the first
      things to configure, because every other control in this register is
      worthless if no one is told it fired.
  - id: POS-043
    lab: "10"
    setting: Microsoft 365 alert policy - LAB-BEC-Forwarding-Rule-Created
    location: Defender portal > Email & collaboration > Policies & rules > Alert policy
    state: Custom policy, Medium, Threat management, activity MailRedirect, no conditions, All users, every-time trigger, admin recipient, no daily notification limit, enabled 2026-07-28 19:09
    baseline: No custom alert policy existed; 48 built-in policies active, one of which already covers this activity
    kind: hardened
    production: Check built-ins for overlap first; scope by user or condition; set a daily notification limit; deliver to a monitored SecOps mailbox rather than a named admin
    revisit: true
    verified: 2026-07-28
    note: >-
      Created 2026-07-28 19:09 local (UTC-07:00) at Email & collaboration >
      Policies & rules > Alert policy. Name LAB-BEC-Forwarding-Rule-Created,
      Medium, category Threat management, activity MailRedirect, no conditions,
      scope All users, trigger "every time an activity matches", recipient the
      admin only, enabled on creation. The first detection AUTHORED in this
      environment rather than supplied by Microsoft - see DET-003 and Lab 10.

      LICENSING CONFIRMED BY OBSERVATION. All three trigger types rendered: every-
      time, threshold, and unusual volume. The latter two require E5 or a Defender
      for Office 365 P2 / M365 E5 Compliance / eDiscovery add-on, so their
      presence is a live entitlement check rather than an inference from the SKU.

      INHERITED DEFAULT 1 - the threshold trigger is PRE-SELECTED, at 15
      activities in 60 minutes. In a three-identity tenant no threshold policy on
      any activity would ever fire. Accepting the default would produce a policy
      that is enabled, correctly configured, and structurally silent - and the
      guidance about that failure mode sits three sections away from the page that
      pre-selects it. Changed deliberately to every-time.

      INHERITED DEFAULT 2 - the daily notification limit defaults to NO LIMIT. An
      unconditioned, all-user, every-time policy is therefore an unmetered mail
      generator by default. Left uncapped here because a cap could suppress the
      notification being measured; that is a test decision, not an endorsement.
      Eighth inherited silent-or-noisy default recorded in this register.

      FRIENDLY LABEL VS SCHEMA VALUE. The picker offers "Created mail
      forward/redirect rule"; the stored condition reads "Activity is
      MailRedirect", and MailRedirect is the string that appears in the alert body
      and in the unified audit log. The label is UI sugar over the schema value,
      and the schema value is the one you hunt on. Nothing in the wizard says so -
      it surfaces only on the review page.

      THE POLICY WAS REDUNDANT AND NOBODY CHECKED. A built-in policy, "Creation of
      forwarding/redirect rule", covers the same activity and fired alongside this
      one at Informational - same activity, same user, same timestamp, two alerts,
      two emails, identical Details text. This tenant holds 49 alert policies, 48
      of them built-in. The design step that was missed is trivial: search the
      existing policies before authoring a new one. Its absence produced duplicate
      alerting on the very first custom policy in the tenant, which is how alert
      fatigue actually starts - not from bad policies but from unexamined overlap
      with the ones already present.

      The duplication stops at the mailbox. Correlation produced ONE incident (ID
      2), and it took this policy's name and Medium severity rather than the
      built-in's Informational. So the cost is notification noise, not queue
      noise.

      SEVERITY IS THE ONLY FIELD THIS POLICY CHANGED. Both emails carry identical
      Details text, so that string is a property of the ACTIVITY, not of the
      policy. The description written here - carrying the MITRE T1114.003
      reference - appears in no notification and exists only in the portal.

      FIRST WORKING SECURITY NOTIFICATION PATH IN THIS TENANT. POS-042 records
      Defender XDR with no notification rules at all across incidents, actions and
      threat analytics, and the real incident Lab 03 produced on 2026-07-18 told
      nobody. Alert policies are a separate Purview-side mechanism, so this does
      not contradict POS-042 - it sharpens it. The capability exists in this
      tenant; it does not exist where the incident queue lives.

      Measured end to end, 2026-07-28: policy enabled 19:09, inbox rule saved
      19:14, activity recorded 02:15:00 UTC (19:15 local), both emails delivered
      19:18. Roughly four minutes from action to notification. The source guidance
      says only "give it time"; this is the number.

      Dependency worth stating: this detects nothing without unified audit logging
      (POS-035), which was off until 2026-07-27 and was enabled during Lab 09 for
      an unrelated reason. Had that not happened, this policy would have been
      created, enabled, and silent.

      Production answer: check the built-in policies before authoring a custom
      one, scope by user or condition rather than All users, set a daily
      notification limit, and send to a monitored SecOps mailbox rather than an
      individual admin. Left in the lab-shaped configuration deliberately so the
      trigger would be unambiguous.
  - id: POS-044
    lab: "08"
    setting: Microsoft Sentinel UEBA (User and Entity Behavior Analytics)
    location: Defender portal > System > Settings > Microsoft Sentinel > UEBA
    state: Enabled 2026-07-28 19:58 local. Entra ID sync on, Active Directory off, 7 data sources connected (3 carrying data), behaviors layer off.
    baseline: Off - no UEBA tables existed on the workspace side; IdentityInfo was XDR-lake only
    kind: hardened
    production: Enabled with a population large enough for peer analysis to mean something, only the data sources that actually carry data connected, and the storage cost of the generated tables budgeted rather than discovered
    revisit: true
    verified: 2026-07-29
    note: >-
      Enabled 2026-07-28 19:58 local (02:58 UTC) at Defender > System > Settings >
      Microsoft Sentinel > UEBA. Microsoft Entra ID directory sync on; Active
      Directory left off (it needs Defender for Identity and on-prem AD, neither
      of which exists here). Seven data sources connected. Behaviors layer - a
      separate tab, enabled independently, creating SentinelBehaviorInfo and
      SentinelBehaviorEntities - deliberately left OFF to keep one variable.

      THE COST FINDING, MEASURED RATHER THAN QUOTED. Microsoft Learn states that
      no licence is required and there is no extra cost for UEBA, but that it
      generates new data in new workspace tables and additional storage charges
      therefore apply. Both halves are true and only the first is memorable.
      IdentityInfo now appears as a BILLABLE DataType at 0.001416 MB/24h,
      alongside SigninLogs (0.038757) and AuditLogs (0.003583). Total billable
      volume 0.0437 MB/day against a 10 GB/day allowance. The principle is proven;
      the bill is not. "The feature is free" and "enabling it is free" are
      different claims.

      THE STORE-PARTITION METHOD DETECTED A TABLE CHANGING SIDES. On 2026-07-26
      IdentityInfo appeared in the Defender census and NOT in the Azure one - XDR-
      only, which was the evidence used at the time to conclude UEBA was not
      running. It is now workspace-resident with four rows. The method built
      during the Lab 08 correction did exactly what it was built for, on a
      question it was not built for.

      PREDICTION 2 OF 4, recorded before the fact. Predicted that
      BehaviorAnalytics, IdentityInfo, UserPeerAnalytics and UserAccessAnalytics
      would cross to the workspace side. IdentityInfo (4 rows) and
      BehaviorAnalytics (1 row) appeared; UserPeerAnalytics and
      UserAccessAnalytics did not. HYPOTHESIS, NOT ESTABLISHED: a three-identity
      tenant has no peer groups to compare against and almost no access history,
      so those two may be structurally unpopulatable here rather than merely slow.
      The competing explanation is ordinary latency - Learn mentions a 14-day
      resync cycle - and a single census cannot separate them.

      INITIAL SYNC TOOK UNDER AN HOUR, NOT "A FEW DAYS". Enabled 02:58 UTC;
      IdentityInfo carries data at 03:50 UTC. Learn's estimate is presumably
      written for organisations with thousands of identities; for three it is off
      by roughly two orders of magnitude. AzureActivity independently corroborates
      the enablement, recording control-plane writes at 03:08 UTC.

      BehaviorAnalytics INHERITS THE SOURCE EVENT'S TIMESTAMP. Its only row reads
      13:25:48.657 UTC - identical to the millisecond to the latest SigninLogs
      row. The behaviour record carries the time of the underlying activity, not
      the time UEBA produced it. Consequence for hunting: UEBA's own processing
      latency cannot be measured from TimeGenerated, and a BehaviorAnalytics row
      tells you when something happened, not when it was noticed.

      ENABLING UEBA IS THREE ACTS, AND THE PAGE REPORTS "ENABLED" AFTER THE FIRST.
      Feature toggle, then directory sync, then data source connection. With the
      toggle on and nothing else done, both directory services read "Sync
      disabled" and the source list read "0 sources" - the feature switched on and
      analysing nothing. Only the empty-state text ("Start sync for at least one
      directory to see the available data sources") reveals the required order.
      Configured is not effective, in a feature whose own status page says
      otherwise.

      "CONNECT AVAILABLE DATA SOURCES" CONNECTS EVERYTHING ELIGIBLE, AND ELIGIBLE
      MEANS THE CONNECTOR EXISTS. Seven sources went green; THREE carry data. AAD
      Managed Identity SignIn Logs and AAD Service Principal SignIn Logs are
      connected to log types deliberately declined in Lab 08 (POS-034) - green
      because the Entra connector exists, empty because its log types were
      refused. Security Events names the LEGACY AGENT connector, where Lab 07
      built ingestion via AMA and a DCR. Device Logon Events needs a running
      device and both VMs are deallocated. Four sources will read Connected
      indefinitely and contribute nothing, and nothing on the page distinguishes
      them from the three that work.

      The bulk action was taken rather than the curated three, and is recorded as
      CHOSEN rather than defaulted - it is also the path the portal labels
      Recommended settings, and therefore the realistic one. Reverting three
      sources afterwards would have produced a half-corrected state harder to
      describe honestly than one clean decision.

      The data source list is a CATALOGUE, NOT AN INVENTORY. AWS CloudTrail, GCP
      Audit Logs and Okta are listed and greyed out with "Data source is not
      ingested to Sentinel" plus a Content Hub link. It shows the feature's reach
      independently of this tenant, which is better design than hiding them.

      PREREQUISITE CLAIM CORRECTED. Microsoft Learn lists Microsoft Sentinel
      Contributor at workspace scope and Log Analytics Contributor at resource-
      group scope - Azure RBAC - and this project asserted on that basis that
      Global Administrator alone would not suffice. The portal's own banner reads
      "Only a Global Administrator or a Security Administrator in your Microsoft
      Entra ID can turn this feature on or off", an Entra role, and the enable
      succeeded. Documentation and portal name different requirements; the portal
      was right about what the portal enforces.

      WHAT THIS CANNOT SHOW: UEBA's actual value. Fifteen days of tenant life,
      three identities and almost no activity cannot produce a behavioural
      baseline, and anomaly detection without a baseline detects nothing. This was
      designed as a PLUMBING TEST from the outset - does enabling it create the
      tables, does the data cross to the billable side, how long does sync take -
      and must not be read as an evaluation of UEBA.
