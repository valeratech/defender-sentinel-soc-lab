      Deliberately minimal: no directory roles, no group memberships, usage
      location set at creation because a licence cannot be assigned without one
      and the failure does not say so. Not given Virtual Machine User Login, and
      not given labuser's role either. Coupling the SOC console to the endpoint
      sign-in identity would mean that compromising the box under investigation
      hands over the console it is investigated from - POS-021's own Primary
      Refresh Token argument, pointed the other way.

      No licence was assigned, and none was needed. analyst reached the Defender
      portal and, after POS-026's activation, the views the role grants. The
      guide's prerequisites table covers what is required to create a role and
      says nothing about what the assignee needs; this is the answer it does not
